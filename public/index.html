<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상법짱2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f4;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:860px;min-height:100vh;margin:auto;background:#fff;padding-bottom:90px;box-shadow:0 0 30px #0001}
.hero{padding:44px 25px 30px;background:linear-gradient(145deg,#102b1d,#214c35);color:#fff;border-radius:0 0 28px 28px}
.brand{font-weight:800;font-size:14px;margin-bottom:28px}.hero h1{font-size:32px;line-height:1.25;margin:0 0 10px;letter-spacing:-1.3px}
.hero p{margin:0;opacity:.82;font-size:14px;line-height:1.6}
.section{padding:14px 20px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:4}
.back{border:0;background:none;font-size:22px}.title{padding:26px 22px 10px}.title h1{margin:0 0 7px;font-size:26px}.title p{margin:0;color:#777;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f6f8f7;border-radius:14px;padding:14px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#777}
.group{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px;background:#fff}.group b{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips button{border:1px solid #dfe4e1;background:#f8faf9;border-radius:9px;padding:8px 12px;transition:0.15s;font-size:13px}
.chips button:hover{background:#eef3f0}
.chips button.active{background:#173d2a;color:#fff;border-color:#173d2a;font-weight:bold}
.primary,.secondary,.danger{border:0;border-radius:13px;padding:14px 17px;font-weight:800}.primary{background:#173d2a;color:#fff}.secondary{background:#edf0ee;color:#303532}.danger{background:#f8e8e8;color:#982f2f}.full{width:100%;margin-top:10px}
.card{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px}
.upload{border:2px dashed #b7c2bc;border-radius:18px;padding:28px;text-align:center;background:#fafcfb}.upload .ico{font-size:42px}
.file{margin:14px 0;background:#f0f3f1;border-radius:10px;padding:11px;text-align:left;font-size:13px}.hidden{display:none}
.notice{padding:13px 15px;border-radius:12px;background:#f5f7f6;color:#666;font-size:12px;line-height:1.6}
.notice.warn{background:#fff8e8;color:#76551a}.notice.good{background:#edf8f0;color:#245c35}.notice.bad{background:#fff2f2;color:#8b2c2c}
.progress{height:7px;background:#e7ebe8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#214c35;transition:.3s}
.reviewBox label{display:block;font-size:12px;color:#777;margin:14px 0 6px}.reviewBox input,.reviewBox textarea,.reviewBox select{width:100%;border:1px solid #dfe4e1;border-radius:10px;padding:11px;outline:none;line-height:1.55}
.row{display:flex;gap:9px}.row>*{flex:1}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#eef3f0;color:#31533f;font-size:11px;font-weight:800}
.badge.warn{background:#fff1cf;color:#805b16}.badge.red{background:#ffe8e8;color:#922e2e}.badge.blue{background:#e8f0ff;color:#28518b}.badge.gray{background:#f0f0f0;color:#555}
.badge.btn{cursor:pointer;border:1px solid #d5dad7}
.badge.btn:disabled{opacity:0.4;cursor:not-allowed}
.listItem{border:1px solid #e1e5e3;border-radius:14px;padding:15px;margin-bottom:10px}.listItem small{color:#777}.empty{text-align:center;color:#888;padding:60px 20px}
.qtext{font-size:20px;line-height:1.65;margin:18px 0 22px;white-space:pre-wrap}.answers{display:grid;gap:9px}
.answer{border:1px solid #dfe4e1;background:#fff;border-radius:13px;padding:14px 16px;text-align:left;line-height:1.5;transition:0.12s}
.answer.sel{border:2px solid #173d2a;background:#f2f7f4}
.result{margin-top:18px;padding:18px;border-radius:16px;background:#f5f8f6}.wrong{background:#fff7f7;border:1px solid #efd0d0}.correct{border:1px solid #cfe2d6}
.explain{border-top:1px solid #e2e6e3;margin-top:14px;padding-top:14px;line-height:1.65;white-space:pre-wrap}.note{margin-top:14px}.note input{width:100%;margin-top:6px;border:1px solid #dfe4e1;border-radius:9px;padding:10px}

/* 하단 6탭 네비게이션 */
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(860px,100%);height:70px;background:#fff;border-top:1px solid #e5e8e6;display:grid;grid-template-columns:repeat(6,1fr);z-index:5}.bottom button{border:0;background:#fff;color:#555}.bottom small{display:block;margin-top:4px;font-size:10px}
.meta{font-size:12px;color:#777;line-height:1.6}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.kpi>div{background:#f7f8f7;border-radius:12px;padding:12px}.kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:#777}
details{border:1px solid #e1e5e3;border-radius:12px;padding:10px 12px;margin-top:10px}summary{cursor:pointer;font-weight:700}
.search{width:100%;border:1px solid #dfe4e1;border-radius:11px;padding:11px}
.optionCard{border:2px solid #e1e5e3;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.optionCard.active{border-color:#173d2a;background:#f4f8f5}
.rangeWrap{margin:16px 0 10px}
.rangeWrap input[type=range]{width:100%;margin:10px 0;accent-color:#173d2a}

.tocBox{background:#fbfcfa;border:1px solid #dce4df;border-radius:14px;padding:14px;margin-bottom:10px}
.tocBoxHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed #e1e5e3}
.tocSubBox{background:#fff;border:1px solid #e8edea;border-radius:10px;padding:10px;margin-top:8px}

.segmentedControl{display:flex;background:#eaeeeb;border-radius:12px;padding:4px;gap:4px;margin-top:10px}
.segmentedControl button{flex:1;border:0;background:transparent;padding:12px 0;border-radius:9px;font-weight:700;font-size:13px;color:#555;transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
.segmentedControl button.active{background:#fff;color:#173d2a;box-shadow:0 2px 8px rgba(0,0,0,0.08)}

/* 타이머 UI */
.timerBox{background:#fff3f3;border:1px solid #ffd0d0;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.timerProgress{height:5px;background:#f0e3e3;border-radius:99px;overflow:hidden;margin-top:4px}
.timerProgress span{display:block;height:100%;background:#d94848;transition:0.1s linear}
.timerText{font-size:14px;font-weight:800;color:#c02b2b}

/* 모달 */
.modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modalContent{background:#fff;border-radius:20px;width:min(660px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 35px rgba(0,0,0,0.2)}
.modalHeader{padding:18px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modalBody{padding:18px 22px;overflow-y:auto;flex:1}
.modalFooter{padding:14px 22px;border-top:1px solid #eee;display:flex;gap:10px}

.colList{display:flex;flex-direction:column;gap:3px}
.colItem{width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:6px;font-size:12px;line-height:1.35;color:#333;cursor:pointer;word-break:break-all}
.colItem:hover{background:#f0f4f2}
.colItem.active{background:#173d2a;color:#fff;font-weight:bold}
.colItem small{opacity:0.8;font-size:11px}

.inputError{border:2px solid #d94848 !important;background:#fff8f8 !important}
.errMsg{color:#c02b2b;font-size:11px;font-weight:700;margin-top:4px;display:block}

/* 시험 결과 카드 */
.testRankCard{background:#fbfcfa;border:1px solid #e1e5e3;border-radius:12px;padding:12px;margin-bottom:8px}
.badge.good{background:#e3f4e8;color:#1f5f33}
.resHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 10px}
.resFilters{display:flex;gap:6px;margin-left:auto}
.resFilters select{border:1px solid #d5dad7;border-radius:9px;padding:7px 9px;background:#fff;font-size:13px}
.resItem{border:1px solid #e1e5e3;border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}
.resItem.wrongItem{border-left:4px solid #d94848}.resItem.rightItem{border-left:4px solid #2f8a4c}
.resItem summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.resItem summary::-webkit-details-marker{display:none}
.resItem summary .num{font-weight:800;min-width:34px;font-size:14px}
.resItem summary .txt{flex:1;font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resItem summary .sec{font-size:12px;color:#777;white-space:nowrap}
.resItem summary .chev{transition:transform .15s;color:#999}
.resItem[open] summary .chev{transform:rotate(90deg)}
.resBody{padding:4px 14px 14px;font-size:13px;line-height:1.6;border-top:1px solid #eef1ef}
.resChoice{padding:6px 9px;border-radius:8px;margin:4px 0;background:#f6f8f7}
.resChoice.isAns{background:#e3f4e8;font-weight:700}.resChoice.isMineWrong{background:#ffe8e8}
.editorLine{font-size:11px;color:#8a8f8c;margin-top:4px}
/* 상법짱2026: 좌우 슬라이드 선택 카드 */
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.slider::-webkit-scrollbar{height:6px}.slider::-webkit-scrollbar-thumb{background:#d5ddd8;border-radius:9px}
.slide{flex:0 0 72%;max-width:340px;scroll-snap-align:center;border:2px solid #e1e5e3;border-radius:18px;padding:20px;cursor:pointer;background:#fff;transition:.15s}
.slide.active{border-color:#173d2a;background:#f2f7f4;box-shadow:0 4px 14px #173d2a22}
.slide .big{font-size:22px;font-weight:800;margin:6px 0 4px}
.unitHead{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:6px 2px;font-size:15px;flex-wrap:wrap}
.unitHead .chev2{color:#888;font-size:12px;width:14px}
.filterGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filterGrid label{font-size:11px;color:#777;display:flex;flex-direction:column;gap:4px}
.filterGrid select{border:1px solid #d5dad7;border-radius:9px;padding:9px;background:#fff;font-size:13px;color:#222}
.listItem.clickable{cursor:pointer}.listItem.clickable:hover{background:#f7faf8}
.answers.oxRow{grid-template-columns:1fr 1fr;gap:12px}
.oxBtn{text-align:center;font-size:22px;font-weight:800;padding:22px 10px}
.srcLine{font-size:12px;color:#6b726e;margin-top:12px;padding-top:8px;border-top:1px dashed #dfe4e1;white-space:normal}
</style>
</head>
<body><div id="app"></div>
<script>
const SUBJECTS={
  "민사법":["상법"]
};

const SAMPLE = [];

let bank = [...SAMPLE];
let appInfo = {title:"상법짱2026", exams:[], categoryOrder:[], version:""};
let daily = [];
let loaded = false, loadError = false;
let stats = {};
let settings = {lastSubject:null, lastIndex:{}, lastId:{}};
let bookmarks = [];
let notes = {};
let masterMeta = {version:6, bookTitle:"상법짱2026", processing:{lastSourcePage:null,hasIncompleteQuestion:false,incompleteQuestionId:null}, warnings:[]};

let currentUser = localStorage.getItem("law_quiz_user") || null;
let authToken = localStorage.getItem("law_quiz_token") || null;
// 예전 버전(토큰 없이 이름만 저장)으로 로그인돼 있던 경우 다시 로그인하도록 정리
if(currentUser && !authToken){ currentUser = null; localStorage.removeItem("law_quiz_user"); }

// 서버 요청 공통 함수 (로그인 토큰 자동 첨부)
async function api(url, opts = {}){
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch(url, { ...opts, headers });
  let data = {};
  try { data = await res.json(); } catch(e) {}
  if(res.status === 401 && authToken){
    clearLogin();
    alert("로그인이 만료되었습니다. 다시 로그인해 주세요.");
    openAuthModal();
  }
  if(!res.ok) throw new Error(data.error || ("서버 오류: " + res.status));
  return data;
}
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function editorLine(q){
  return q && q.updatedBy ? `<div class="editorLine">✏️ 최종 수정: <b>${esc(q.updatedBy)}</b> · ${esc(fmtDate(q.updatedAt))}</div>` : "";
}
// 수정된 문제를 문제은행과 진행 중인 퀴즈/테스트 목록에 모두 반영
function applyQuestionUpdate(nq){
  const sync = arr => (arr||[]).forEach(x=>{ if(x && x.id===nq.id) Object.assign(x, nq); });
  sync(bank); sync(S.queue); sync(S.testQueue);
  if(!bank.some(x=>x.id===nq.id)) bank.push(nq);
}

let S = {
  screen:"home", files:[], pendingQuestions:[], pendingMetaList:[], queue:[], qi:0, selected:[], submitted:false,
  retryPrompt:false, retrying:false, subject:null, group:null,
  search:"", editingId:null, editDraft:null,
  setupGroup:null, setupSubject:null, setupMode:"resume",
  setupPath:[],
  setupLimit:20,
  setupOrder:"sequential",
  setupTimerEnabled:false,
  setupTimerSeconds:30,
  timeLeft:30,
  timerInterval:null,
  bankFilter:{
    sort:"default",
    subject:"전체",
    major:"전체",
    minor:"전체",
    detail:"전체"
  },
  showBankFilterModal:false,
  showAddModal:false,
  addDraft:null,
  addErrors:{},

  // 테스트 모드 상태
  testSubject: "상법",
  testGroup: "민사법",
  testPath: [],
  testLimit: 20,
  testMinutes: 30,
  testQueue: [],
  testQi: 0,
  testAnswers: {},
  testTimeSpent: {},
  testTimeLeft: 0,
  testTimerInterval: null,
  testCurrentEnterTime: 0,
  testResultData: null,

  // 상법짱2026
  homeType: "ox", homeMode: "exam",
  setupType: "ox", setupExam: null,
  quizLabel: "", quizBack: "setupPage", returnQuiz: null,
  testType: "ox", testScope: "all", testExam: null, testOrder: "random",
  bankType: "all", bankLimit: 100,
  wrongType: "all", showGraduated: false,
  authMode: "login", authPassword2: "",
  sel: newSel(), testSel: newSel(), keyList: [], openUnits: {},
  bankF: {src:"", p1:"", p2:"", only:"", sort:"toc"}, qPopup: null,
  setupMode: "exam", learnMode: "resume", setupCount: null,

  // 계정 모달
  showAuthModal: false,
  authUsername: "",
  authPassword: "",
  authError: ""
};
let dirty = false;

// 서버에서 데이터 로드 (계정별 분리)
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function go(s){
  stopTimer();
  stopTestTimer();
  S.qPopup=null; S.editingId=null;
  S.screen=s;
  render();
  if(s==="settingsPage" && currentUser) loadDaily().then(()=>{ if(S.screen==="settingsPage") render(); });
}
function topBar(t,b="home"){return `<header class="top"><button class="back" onclick="go('${b}')">←</button><b>${esc(t)}</b><span></span></header>`}

// 인증 로직
function extractCategoryPath(q, meta){
  if(Array.isArray(q.categoryPath) && q.categoryPath.length > 0){
    return q.categoryPath.filter(Boolean).map(x=>String(x).trim());
  }
  if(q.category && typeof q.category === "object"){
    return [q.category.major, q.category.minor, q.category.detail].filter(Boolean).map(x=>String(x).trim());
  }
  if(typeof q.category === "string" && q.category.trim()){
    return q.category.split(">").map(x=>x.trim()).filter(Boolean);
  }
  return ["기본단원"];
}

function normalizeQuestion(q,i,meta){
  let type=q.type==="ox"?"ox":"mcq";
  let choices=Array.isArray(q.choices)?q.choices.map(x=>String(x??"")):[];
  let answer=String(q.answer??"").trim();
  if(type==="ox") answer=answer.toUpperCase();
  let categoryPath=extractCategoryPath(q, meta);
  let category=categoryPath.join(" > ");

  return {
    id:String(q.id||("import-"+Date.now()+"-"+i)),
    number:String(q.number??(i+1)),
    group:String(q.group||q.subjectGroup||meta.subjectGroup||"민사법"),
    subject:String(q.subject||meta.subject||"상법"),
    categoryPath,
    category,
    type,text:String(q.text??q.question??""),
    choices,answer,
    explanation:String(q.explanation??""),
    incomplete:Boolean(q.incomplete),
    sourcePages:q.sourcePages==null?(q.source?.pages?String(q.source.pages):""):String(q.sourcePages),
    meta:Object.assign({app:"sangbeop2026"}, (q.meta && typeof q.meta==="object") ? q.meta : {})
  };
}

function issuesFor(nq){
  let reasons=[];
  if(!nq.text.trim()) reasons.push("본문 없음");
  if(nq.type==="mcq" && !nq.choices.length) reasons.push("선지 없음");
  if(nq.type==="ox" && !["O","X"].includes(nq.answer) && !nq.answer.includes("O") && !nq.answer.includes("X")) reasons.push("OX 정답 오류");
  if(!nq.subject) reasons.push("과목 정보 없음");
  return reasons;
}

function validateSingleFile(d){
  if(!d || typeof d!=="object") throw Error("JSON 객체 형식이 아닙니다.");
  if(!Array.isArray(d.questions)) throw Error("questions 배열이 없습니다.");
  let meta={...d};
  let qs=d.questions.map((q,i)=>{
    let nq=normalizeQuestion(q,i,d);
    nq.issues=issuesFor(nq);
    return nq;
  });
  return {meta,qs};
}

function subjectMap(){
  let map={};
  for(const g in SUBJECTS) map[g]=[...SUBJECTS[g]];
  for(const q of bank){
    let g=q.group||"미분류",s=q.subject||"미분류";
    if(!map[g]) map[g]=[];
    if(!map[g].includes(s)) map[g].push(s);
  }
  return map;
}

function progress(subject){
  let arr=bank.filter(q=>q.subject===subject);
  let solved=arr.filter(q=>st(q.id).attempts>0).length;
  return {n:arr.length,solved,rate:arr.length?Math.round(solved/arr.length*100):0};
}

function totals(){
  let vals=Object.values(stats);
  let attempted=vals.reduce((a,x)=>a+(x.attempts||0),0);
  let wrong=vals.reduce((a,x)=>a+(x.wrong||0),0);
  return {attempted,wrong,accuracy:attempted?Math.round((attempted-wrong)/attempted*100):0};
}

function shuffleArray(arr) {
  let array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function matchesPath(q, path){
  if(!path || !path.length) return true;
  if(!q.categoryPath || !q.categoryPath.length) return false;
  for(let i=0; i<path.length; i++){
    if(q.categoryPath[i] !== path[i]) return false;
  }
  return true;
}

function isPathEqual(p1, p2){
  if(!p1 && !p2) return true;
  if(!p1 || !p2) return false;
  if(p1.length !== p2.length) return false;
  return p1.every((v,i)=>v===p2[i]);
}

function renderTocTree(tree, targetState = "setup"){
  let topKeys = Object.keys(tree);
  if(!topKeys.length) return `<div class="meta">등록된 목차가 없습니다.</div>`;

  const curPath = targetState === "test" ? S.testPath : S.setupPath;

  return topKeys.map(k1=>{
    let node1 = tree[k1];
    let isNode1Sel = isPathEqual(curPath, node1.path);
    let subKeys = Object.keys(node1.children);

    return `<div class="tocBox">
      <div class="tocBoxHeader">
        <b style="font-size:15px">📁 ${esc(node1.name)} <small style="color:#777">(${node1.count})</small></b>
        <button class="badge btn ${isNode1Sel?'blue':''}" onclick="${targetState==='test'?'S.testPath':'S.setupPath'}=${JSON.stringify(node1.path).replace(/"/g,"'")};render()">
          ${isNode1Sel ? "✓ 선택됨" : "중단원 전체 풀기"}
        </button>
      </div>
      ${subKeys.length ? `
        <div class="chips">
          ${subKeys.map(k2=>{

                </div>

function parseAnswerTokens(ans){
  if(!ans) return [];
  if(Array.isArray(ans)) return ans.map(x=>String(x).trim());
  let s = String(ans);
  const circled = {'①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑩':'10'};
  s = s.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, m => circled[m] || m);
  return s.split(/[,/ ]+/).map(x=>x.trim()).filter(Boolean);
}

function checkAnswerCorrect(selected, answer){
  let user = (Array.isArray(selected) ? selected : [selected]).map(x=>String(x).trim()).filter(Boolean).sort();
  let corr = parseAnswerTokens(answer).sort();
  if(!corr.length) return false;
  if(user.length !== corr.length) return false;
  return user.every((v, i) => v.toUpperCase() === corr[i].toUpperCase());
}

function isOwnQ(q){ return (q.meta && q.meta.app === "sangbeop2026") || String(q.id||"").startsWith("custom-"); }
function prepQ(q){
  q.meta = q.meta || {};
  q.noAnswer = !!q.meta.noAnswer;
  q.multi = !!q.meta.multi;
  return q;
}
function typeLabel(t){ return t === "ox" ? "OX형" : "5지선다형"; }
function examList(){
  // 데이터에 정의된 회차 순서를 따르고, 없으면 문제에서 추출
  let seen = {}, arr = [];
  (appInfo.exams || []).forEach(e => { if(!seen[e.tag]){ seen[e.tag]=1; arr.push({tag:e.tag, exam:e.exam, title:e.title, type:e.type}); } });
  bank.forEach(q => { let m=q.meta||{}; if(m.examTag && !seen[m.examTag]){ seen[m.examTag]=1; arr.push({tag:m.examTag, exam:m.exam, title:m.examTitle, type:m.examType}); } });
  return arr;
}
function examTitleOf(tag){ let e = examList().find(x=>x.tag===tag); return e ? (e.title || e.exam) : tag; }
function examShort(e){ return e.type === "변시" ? `${e.exam.slice(0,4)} 변시` : e.exam; }
function scopeList(type, examTag){
  return bank.filter(q => (!type || q.type === type) && (!examTag || (q.meta && q.meta.examTag === examTag)));
}
// 정답 판정 (정답 없음 문항은 아무 선지나 선택하면 정답 처리)
function isCorrectQ(q, sel){
  let arr = (Array.isArray(sel) ? sel : [sel]).filter(Boolean);
  if(q.noAnswer) return arr.length > 0;
  return checkAnswerCorrect(arr, q.answer);
}
function ansLabel(q){
  if(q.noAnswer) return "정답 없음 (상법 개정) — 어느 선지를 골라도 정답 처리";
  return q.answer || "(정답 미설정)";
}
function explainHtml(q){
  let ex = q.explanation && q.explanation.trim() ? q.explanation : (q.meta && q.meta.explanationPending ? "해설 준비 중입니다." : "해설이 없습니다.");
  return esc(ex);
}
function srcLine(q){

  return s ? `<div class="srcLine">📖 출처: ${esc(s)}</div>` : "";
}
function linkedOx(mcqId){ return bank.filter(x => x.type === "ox" && x.meta && x.meta.link === mcqId); }
function kstToday(){ return new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10); }
function isGraduated(id){ let t = st(id), n = gradThreshold(); return n > 0 && t.wrong > 0 && (t.streak||0) >= n; }

// 풀이 결과를 화면용 통계에 즉시 반영
function bumpLocalStats(q, correct){
  let x = st(q.id);
  x = {...x};
  x.attempts++; x.last = new Date().toISOString();
  if(correct){ x.correct++; x.streak = (x.streak||0) + 1; } else { x.wrong++; x.streak = 0; }
  stats[q.id] = x;
  let today = kstToday();
  let d = daily.find(r => r.day === today);
  if(!d){ d = {day: today, attempts: 0, correct: 0}; daily.unshift(d); }
  d.attempts++; if(correct) d.correct++;
}

  if(!currentUser){ daily = []; return; }
  try { const d = await api('/api/daily'); daily = d.days || []; } catch(e){ console.warn(e); }
}
function todayStat(){
  let d = daily.find(r => r.day === kstToday()) || {attempts:0, correct:0};
  return {attempts: d.attempts, correct: d.correct, rate: d.attempts ? Math.round(d.correct / d.attempts * 100) : 0};
}

// 출제 순서
function orderQueue(list, order){
  if(order === "random") return shuffleArray(list);
  if(order === "unsolved"){
    let a = list.filter(q => st(q.id).attempts === 0), b = list.filter(q => st(q.id).attempts > 0);
    b.sort((x,y) => st(x.id).attempts - st(y.id).attempts);
    return [...a, ...b];
  }
  if(order === "wrongfirst"){
    let w = list.filter(q => st(q.id).wrong > 0 && !isGraduated(q.id)), r = list.filter(q => !(st(q.id).wrong > 0 && !isGraduated(q.id)));
    w.sort((x,y) => st(y.id).wrong - st(x.id).wrong);
    return [...w, ...r];
  }
  return list;
}

// 회독 현황
function roundStats(list){
  let n = list.length || 1;
  let c = k => list.filter(q => st(q.id).attempts >= k).length;
  return {n: list.length, r1: c(1), r2: c(2), r3: c(3), p1: Math.round(c(1)/n*100), p2: Math.round(c(2)/n*100), p3: Math.round(c(3)/n*100)};
}
function roundCard(list){
  let r = roundStats(list);
  return `<div class="card" style="background:#f6f8f7">
    <b>📚 회독 현황</b> <span class="meta">(${r.n}문제)</span>
    ${[[1,r.r1,r.p1],[2,r.r2,r.p2],[3,r.r3,r.p3]].map(([k,cnt,p])=>`
      <div style="display:flex;justify-content:space-between;font-size:12px;margin:8px 0 4px"><span>${k}회독</span><span>${cnt}/${r.n} (${p}%)</span></div>
      <div class="progress"><span style="width:${p}%"></span></div>`).join('')}
  </div>`;
}

function buildTocTree(g, s, list){
  let arr = list || bank.filter(q=>(!g||q.group===g)&&q.subject===s);
  let root = {};
  for(let q of arr){
    let path = (q.categoryPath && q.categoryPath.length) ? q.categoryPath : ["기본단원"];
    let curr = root;
    for(let i=0; i<path.length; i++){
      let name = path[i];
      if(!curr[name]){
        curr[name] = { name, count: 0, path: path.slice(0, i+1), children: {} };
      }
      curr[name].count++;
      curr = curr[name].children;
    }
  }
  return root;
}

  stopTimer();

  let list = linkedOx(mcqId);

  S.quizLabel = "지문 OX"; S.setupTimerEnabled = false;
  render();
}
function returnToMcq(){
  let r = S.returnQuiz; if(!r) return;
  S.returnQuiz = null;
  S.queue = r.queue; S.quizLabel = r.label; S.quizBack = r.back; S.setupTimerEnabled = r.timer;
  S.qi = r.qi; S.selected = []; S.submitted = false; S.retryPrompt = false; S.retrying = false;
  if(S.qi < S.queue.length - 1){ S.qi++; render(); startTimerIfNeeded(); }
  else { alert("설정한 문제 세트를 모두 완수했습니다!"); go(S.quizBack === "setupPage" ? "home" : (S.quizBack || "home")); }
}

function passQ(){
  stopTimer();
  if(S.qi < S.queue.length - 1){
    S.qi++;
    S.selected = []; S.submitted = false; S.retryPrompt = false; S.retrying = false;
    render();
    startTimerIfNeeded();
  }else if(S.returnQuiz){
    returnToMcq();
  }else{
    alert("세트 내 문제를 모두 확인했습니다. 패스한 문제는 미풀이 상태로 보존됩니다.");
    go("home");
  }
}

function choose(a){
  if(S.submitted) return;
  let q = S.queue[S.qi];
  if(q.type === "ox"){
    S.selected = [String(a)];
    submitQ();          // OX는 고르면 바로 채점
    return;
  } else {
    if(!Array.isArray(S.selected)) S.selected = [];
    let str = String(a);
    let idx = S.selected.indexOf(str);
    if(idx >= 0) S.selected.splice(idx, 1);
    else { S.selected.push(str); S.selected.sort((x,y)=>parseInt(x,10)-parseInt(y,10)); }
  }
  render();
}

function chooseTestAnswer(a){
  let q = S.testQueue[S.testQi];
  let cur = S.testAnswers[q.id] || [];
  if(q.type === "ox"){
    S.testAnswers[q.id] = [String(a)];
  } else {
    let str = String(a);
    let idx = cur.indexOf(str);
    if(idx >= 0) cur.splice(idx, 1); else cur.push(str);
    cur.sort((x,y)=>parseInt(x,10)-parseInt(y,10));
    S.testAnswers[q.id] = cur;
  }
  render();
}

function finishTestExam(){
  recordCurrentQuestionTime();
  stopTestTimer();
  let items = S.testQueue.map((q, idx)=>{
    let userAns = S.testAnswers[q.id] || [];
    let isCorr = isCorrectQ(q, userAns);
    let spent = S.testTimeSpent[q.id] || 0;
    bumpLocalStats(q, isCorr);
    if(currentUser){
      api('/api/stats', { method: 'POST', body: JSON.stringify({ id: q.id, isCorrect: isCorr }) }).catch(e=>console.warn(e));
    }
    return { q, idx: idx + 1, userAns, isCorr, spent };
  });
  let correctCount = items.filter(it=>it.isCorr).length;
  let totalSpentSec = (S.testMinutes * 60) - Math.max(0, S.testTimeLeft);
  S.testResultData = { total: items.length, items, correctCount, wrongCount: items.length - correctCount, totalSpentSec, score: Math.round((correctCount / items.length) * 100) };
  S.testResultView = "all";
  S.testResultSort = "order";
  S.screen = "testResultPage";
  render();
}

function renderTestResultItems(){
  let res = S.testResultData;
  let list = res.items.filter(it =>
    S.testResultView === "correct" ? it.isCorr :
    S.testResultView === "wrong" ? !it.isCorr : true
  );
  if(S.testResultSort === "time") list = [...list].sort((a,b)=> b.spent - a.spent || a.idx - b.idx);
  else list = [...list].sort((a,b)=> a.idx - b.idx);
  if(!list.length){
    return `<div class="notice ${S.testResultView==='wrong'?'good':''}">${S.testResultView==='wrong'?'🎉 틀린 문제가 없습니다.':'해당하는 문제가 없습니다.'}</div>`;
  }
  return list.map(it=>{
    let q = it.q;
    let ansTokens = q.noAnswer ? [] : parseAnswerTokens(q.answer);
    let choicesHtml = (q.type !== 'ox' && q.choices && q.choices.length) ? q.choices.map((c,i)=>{
      let n = String(i+1);
      let isAns = ansTokens.includes(n);
      let mine = it.userAns.includes(n);
      return `<div class="resChoice ${isAns?'isAns':''} ${mine&&!isAns&&!q.noAnswer?'isMineWrong':''}">${n}. ${esc(c)}${isAns?' ✅':''}${mine?' ← 내 선택':''}</div>`;

// ===== v2: 범위 다중 선택 · 설정 내 로그인 =====
// 선택 상태: {exams:[회차태그...], leaves:[목차 경로 문자열...]}
function newSel(){ return {exams:[], leaves:[]}; }
function selOf(target){ return target === "test" ? S.testSel : S.sel; }
function leafKey(path){ return (path && path.length ? path : ["기본단원"]).join(" > "); }
// onclick 안에 긴 한글 경로를 넣지 않도록 번호로 바꿔 전달
function kid(key){ let i = S.keyList.indexOf(key); if(i < 0){ S.keyList.push(key); i = S.keyList.length - 1; } return i; }
function bankIndex(){
  if(!S._bankIdx || S._bankIdxLen !== bank.length){
    S._bankIdx = {}; bank.forEach((q,i)=>S._bankIdx[q.id]=i); S._bankIdxLen = bank.length;
  }
  return S._bankIdx;
}
// 선택된 범위의 문제 목록 (회차별: 회차 순서 → 목차 순서 / 단원별: 목차 순서)
function selList(type, mode, sel){
  let base = bank.filter(q => q.type === type);
  if(mode === "exam"){
    let set = new Set(sel.exams);
    let idx = bankIndex();
    return base.filter(q => q.meta && set.has(q.meta.examTag))
      .sort((a,b) => ((a.meta.examOrder??99) - (b.meta.examOrder??99)) || (idx[a.id] - idx[b.id]));
  }
  if(mode === "unit"){
    let set = new Set(sel.leaves);
    return base.filter(q => set.has(leafKey(q.categoryPath)));
  }
  return base;
}
function strHash(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return (h>>>0).toString(36); }
function scopeKey(){
  let sel = S.sel, keys = S.setupMode === "exam" ? [...sel.exams].sort() : [...sel.leaves].sort();
  return `${S.setupType}|${S.setupMode}|${strHash(keys.join("|"))}`;
}
function scopeLabel(){
  let sel = S.sel;
  if(S.setupMode === "exam"){
    let ex = examList().filter(e => sel.exams.includes(e.tag));
    let txt = ex.length === 1 ? examShort(ex[0]) : `${ex.length}개 회차`;
    return `${typeLabel(S.setupType)} · ${txt}`;
  }
  let n = sel.leaves.length;
  return `${typeLabel(S.setupType)} · ${n === 1 ? sel.leaves[0].split(" > ").slice(-1)[0] : n + "개 단원"}`;
}

// ---------- 회차 다중 선택 ----------
function toggleExam(target, tag){
  let sel = selOf(target), i = sel.exams.indexOf(tag);
  if(i >= 0) sel.exams.splice(i,1); else sel.exams.push(tag);
  render();
}
function toggleExamGroup(target, type, qtype){
  let sel = selOf(target);
  let tags = examList().filter(e => (type === "all" || e.type === type) && bank.some(q => q.type === qtype && q.meta && q.meta.examTag === e.tag)).map(e=>e.tag);
  let allOn = tags.length && tags.every(t => sel.exams.includes(t));
  if(allOn) sel.exams = sel.exams.filter(t => !tags.includes(t));
  else tags.forEach(t => { if(!sel.exams.includes(t)) sel.exams.push(t); });
  render();
}
function renderExamPicker(target, qtype){
  let sel = selOf(target), exams = examList();
  let cnt = tag => bank.filter(q => q.type === qtype && q.meta && q.meta.examTag === tag).length;
  let group = (type, title, sub) => {
    let list = exams.filter(e => e.type === type && cnt(e.tag) > 0);
    if(!list.length) return "";
    let allOn = list.every(e => sel.exams.includes(e.tag));
    return `<div class="tocBox">
      <div class="tocBoxHeader">
        <b style="font-size:15px">${title} <small style="color:#777">${sub}</small></b>
        <button class="badge btn ${allOn?'blue':''}" onclick="toggleExamGroup('${target}','${type}','${qtype}')">${allOn?'✓ 전체 해제':'전체 선택'}</button>
      </div>
      <div class="chips">${list.map(e => {
        let on = sel.exams.includes(e.tag), s = solvedCount(bank.filter(q=>q.type===qtype&&q.meta&&q.meta.examTag===e.tag));
        return `<button class="${on?'active':''}" onclick="toggleExam('${target}','${esc(e.tag)}')">${on?'✓ ':''}${esc(examShort(e))} <small>${s}/${cnt(e.tag)}</small></button>`;
      }).join('')}</div>
    </div>`;
  };
  let all = exams.filter(e=>cnt(e.tag)>0), allOn = all.length && all.every(e=>sel.exams.includes(e.tag));
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="badge btn ${allOn?'blue':''}" onclick="toggleExamGroup('${target}','all','${qtype}')">${allOn?'✓ 모든 회차 해제':'모든 회차 선택'}</button>
    </div>
    ${group("변시", "📘 변호사시험 기출", "UNION 기출편")}
    ${group("모의", "📗 법전협 모의시험", "민사법 상법 문항")}`;
}
function solvedCount(list){ return list.filter(q => st(q.id).attempts > 0).length; }

// ---------- 목차 다중 선택 ----------
function leavesUnder(qtype, prefix){
  let keys = new Set();
  bank.forEach(q => { if(q.type !== qtype) return; let k = leafKey(q.categoryPath); if(k === prefix || k.startsWith(prefix + " > ")) keys.add(k); });
  return [...keys];
}
function toggleLeaf(target, id){
  let key = S.keyList[id], sel = selOf(target), i = sel.leaves.indexOf(key);
  if(i >= 0) sel.leaves.splice(i,1); else sel.leaves.push(key);
  render();
}
function toggleNode(target, id, qtype){
  let prefix = S.keyList[id], sel = selOf(target);
  let keys = leavesUnder(qtype, prefix);
  let allOn = keys.length && keys.every(k => sel.leaves.includes(k));
  if(allOn) sel.leaves = sel.leaves.filter(k => !keys.includes(k));
  else keys.forEach(k => { if(!sel.leaves.includes(k)) sel.leaves.push(k); });
  render();
}
function toggleAllUnits(target, qtype){
  let sel = selOf(target);
  let keys = [...new Set(bank.filter(q=>q.type===qtype).map(q=>leafKey(q.categoryPath)))];
  let allOn = keys.length && keys.every(k => sel.leaves.includes(k));
  sel.leaves = allOn ? [] : keys;
  render();
}

  return {all, list: all, start: 0};
}
// 5개 단위 문제 수 선택값 (마지막은 전체 수)
function countSteps(n){
  if(n <= 0) return [];
  if(n <= 5) return [n];
  let arr = []; for(let v = 5; v < n; v += 5) arr.push(v); arr.push(n);
  return arr;
}
function currentCount(n){
  let steps = countSteps(n); if(!steps.length) return 0;
  let want = S.setupCount == null ? 20 : S.setupCount;
  let best = steps[0];
  steps.forEach(v => { if(v <= want) best = v; });
  if(want >= n) best = n;
  return best;
}

function startCustomQuiz(){
  let c = setupCandidates();
  if(!c.list.length){ alert("선택한 범위에 문제가 없습니다."); return; }
  let list = S.setupOrder === "random" ? shuffleArray(c.list) : c.list;
  let queue = list.slice(0, currentCount(c.list.length));
  S.group="민사법"; S.subject="상법";
  S.queue=queue; S.qi=0; S.selected=[]; S.submitted=false; S.retryPrompt=false; S.retrying=false;
  S.quizLabel = scopeLabel(); S.quizBack = "setupPage"; S.returnQuiz = null;
  S.screen="quizPage";
  render();
  startTimerIfNeeded();
}

async function submitQ(isTimeout = false){
  stopTimer();
  let q=S.queue[S.qi];
  let c = isTimeout ? false : isCorrectQ(q, S.selected);
  bumpLocalStats(q, c);
  if(!S.returnQuiz && S.quizBack === "setupPage" && S.setupOrder !== "random"){
    settings.lastId[scopeKey()] = q.id;   // 이어 풀기 위치(순서대로 풀 때만 기록)
  }
  if(currentUser){
    api('/api/stats', { method: 'POST', body: JSON.stringify({ id: q.id, isCorrect: c, settings }) }).catch(e=>console.warn(e));
  }
  S.submitted=true;
  if(!c && !S.retrying && !isTimeout && q.type !== "ox") S.retryPrompt=true;   // OX는 다시 풀기 없이 바로 결과
  render();
}
function nextQ(){
  stopTimer();
  if(S.qi<S.queue.length-1){
    S.qi++;S.selected=[];S.submitted=false;S.retryPrompt=false;S.retrying=false;
    render();
    startTimerIfNeeded();
  }else if(S.returnQuiz){
    returnToMcq();
  }else{
    alert("설정한 문제 세트를 모두 완수했습니다!");
    go(S.quizBack && S.quizBack !== "setupPage" ? S.quizBack : "setupPage");
  }
}

function toggleUnitOpen(target, id){
  let name = S.keyList[id], key = target + "|" + name;
  S.openUnits[key] = !S.openUnits[key];
  render();
}
function renderUnitPicker(target, qtype){
  let sel = selOf(target);
  let base = bank.filter(q => q.type === qtype);
  let tree = buildTocTree(null, null, base);
  let selected = new Set(sel.leaves);
  let nodeState = node => {
    let keys = leavesUnder(qtype, leafKey(node.path));
    let on = keys.filter(k => selected.has(k)).length;
    return {all: keys.length > 0 && on === keys.length, on, total: keys.length};
  };
  let chip = node => {
    let k = leafKey(node.path), on = selected.has(k);
    return `<button class="${on?'active':''}" onclick="toggleLeaf('${target}',${kid(k)})">${on?'✓ ':''}${esc(node.name)} <small>(${node.count})</small></button>`;
  };
  let every = Object.keys(tree).length > 0 && Object.keys(tree).every(k => nodeState(tree[k]).all);
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="meta">대단원을 누르면 펼쳐집니다.</span>
      <button class="badge btn ${every?'blue':''}" onclick="toggleAllUnits('${target}','${qtype}')">${every?'✓ 전체 단원 해제':'전체 단원 선택'}</button>
    </div>` + Object.keys(tree).map(k1 => {
    let n1 = tree[k1], s1 = nodeState(n1);
    let open = !!S.openUnits[target + "|" + n1.name];
    return `<div class="tocBox" style="padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <button class="unitHead" onclick="toggleUnitOpen('${target}',${kid(n1.name)})">
          <span class="chev2">${open?'▼':'▶'}</span>
          <b>${esc(n1.name)}</b>
          <small style="color:#777">${n1.count}문제${s1.on?` · <span style="color:#173d2a;font-weight:700">${s1.all?'전체':s1.on+'개 단원'} 선택</span>`:''}</small>
        </button>
        <button class="badge btn ${s1.all?'blue':''}" style="white-space:nowrap" onclick="toggleNode('${target}',${kid(leafKey(n1.path))},'${qtype}')">${s1.all?'✓ 전체 해제':'전체 선택'}</button>
      </div>
      ${open ? `<div class="chips" style="margin-top:10px">
        ${Object.keys(n1.children).map(k2 => {
          let n2 = n1.children[k2];
          let kids = Object.keys(n2.children);
          if(!kids.length) return chip(n2);
          let s2 = nodeState(n2);
          return `<div class="tocSubBox" style="width:100%">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:6px">
              <span style="font-size:13px;font-weight:700">${esc(n2.name)} (${n2.count})</span>
              <button class="badge btn ${s2.all?'blue':''}" onclick="toggleNode('${target}',${kid(leafKey(n2.path))},'${qtype}')">${s2.all?'✓ 해제':'전체 선택'}</button>
            </div>
            <div class="chips">${kids.map(k3 => chip(n2.children[k3])).join('')}</div>
          </div>`;
        }).join('')}
      </div>` : ''}
    </div>`;
  }).join('');
}

function bankTopUnits(){
  let tree = buildTocTree(null, null, bank.filter(q => S.bankType === "all" || q.type === S.bankType));
  return tree;
}
function getFilteredBankQuestions(){
  let F = S.bankF;
  let idx = bankIndex();
  let qList = bank.filter(q=>{
    let m = q.meta || {};
    if(S.bankType !== "all" && q.type !== S.bankType) return false;
    if(F.src === "변시" && m.examType !== "변시") return false;
    if(F.src === "모의" && m.examType !== "모의") return false;
    if(F.src && F.src !== "변시" && F.src !== "모의" && m.examTag !== F.src) return false;
    if(F.p1 && (q.categoryPath||[])[0] !== F.p1) return false;
    if(F.p2 && (q.categoryPath||[])[1] !== F.p2) return false;
    if(F.only === "edited" && !q.updatedBy) return false;
    if(F.only === "wrong" && !(st(q.id).wrong > 0)) return false;
    if(F.only === "unsolved" && st(q.id).attempts > 0) return false;
    if(F.only === "bookmark" && !bookmarks.includes(q.id)) return false;
    if(F.only === "nopending" && !(m.explanationPending)) return false;
    if(S.search){
      let hay = (`${q.text} ${q.category} ${m.exam||''} ${m.examTitle||''} ${m.source||''} ${(q.choices||[]).join(' ')} ${q.explanation||''}`).toLowerCase();
      let words = S.search.toLowerCase().split(/\s+/).filter(Boolean);
      if(!words.every(w => hay.includes(w))) return false;
    }
    return true;
  });
  let rate = q => { let s = st(q.id); return s.attempts ? s.correct/s.attempts : 1; };
  let cmp = {
    toc: (a,b) => idx[a.id] - idx[b.id],
    exam: (a,b) => ((a.meta?.examOrder??99) - (b.meta?.examOrder??99)) || ((a.meta?.qno||0) - (b.meta?.qno||0)) || (idx[a.id]-idx[b.id]),
    examDesc: (a,b) => ((b.meta?.examOrder??-1) - (a.meta?.examOrder??-1)) || (idx[a.id]-idx[b.id]),
    wrong: (a,b) => st(b.id).wrong - st(a.id).wrong || (idx[a.id]-idx[b.id]),
    rate: (a,b) => rate(a) - rate(b) || (idx[a.id]-idx[b.id]),
    edited: (a,b) => String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')) || (idx[a.id]-idx[b.id])
  }[F.sort] || ((a,b)=>idx[a.id]-idx[b.id]);
  return qList.sort(cmp);
}
function setBankF(k, v){
  S.bankF[k] = v;
  if(k === "p1") S.bankF.p2 = "";
  S.bankLimit = 100;
  render();
}

      </div>
      <p style="white-space:pre-wrap;margin:6px 0"><b>${esc(q.text.length>400?q.text.slice(0,400)+'…':q.text)}</b></p>
      ${q.type!=='ox' ? `<div class="meta" style="white-space:pre-wrap">${(q.choices||[]).map((c,i)=>`${i+1}. ${esc(c.length>80?c.slice(0,80)+'…':c)}`).join('\n')}</div>` : ''}
      <div style="font-size:13px;margin-top:6px">정답: <b style="color:#173d2a">${esc(q.noAnswer?'정답 없음':q.answer)}</b></div>
      <small>풀이 ${t.attempts}회 · 오답 ${t.wrong}회 · 정답률 ${t.attempts?Math.round(t.correct/t.attempts*100):0}% ${bookmarks.includes(q.id)?"· ⭐":""}</small>
      ${editorLine(q)}
      ${currentUser ? `<div style="text-align:right;margin-top:6px"><button class="badge btn red" onclick="deleteQuestion('${esc(q.id)}')">🗑️ 삭제</button></div>` : ''}
    </div>`;
  }).join("") + (filtered.length > shown.length ? `<button class="secondary full" onclick="S.bankLimit+=100;refreshBank()">더 보기 (${filtered.length - shown.length}문제 남음)</button>` : '');
}
function bankPage(){
  let filtered = getFilteredBankQuestions();
  let F = S.bankF, exams = examList(), tree = bankTopUnits();
  let p2opts = F.p1 && tree[F.p1] ? Object.keys(tree[F.p1].children) : [];
  let sel = (k, opts, cur) => `<select onchange="setBankF('${k}', this.value)">${opts.map(([v,n])=>`<option value="${esc(v)}" ${cur===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  return topBar("문제은행")+`
  <section class="title" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div>
      <h1>문제은행 · 수정</h1>
      <p id="bankCountText">${bank.length}문제 중 ${filtered.length}문제 표시</p>
      ${!currentUser ? `<p class="meta" style="margin-top:4px">🔒 문제 수정·추가·삭제는 로그인 후 가능합니다.</p>` : ''}
    </div>
    <button class="primary" style="padding:10px 15px;font-size:14px;border-radius:12px;white-space:nowrap" onclick="openAddModal()">➕ 문제 추가</button>
  </section>
  <section class="section">
    <div class="segmentedControl" style="margin:0 0 10px">
      ${[["all","전체"],["ox","OX"],["mcq","5지선다"]].map(([k,n])=>`<button class="${S.bankType===k?'active':''}" onclick="S.bankType='${k}';S.bankF.p1='';S.bankF.p2='';S.bankLimit=100;render()">${n}</button>`).join('')}
    </div>
    <input id="bankSearchInput" class="search" style="margin-bottom:10px" placeholder="검색 (지문·선지·해설·출처, 예: 영업양도 2018 변시)" value="${esc(S.search)}" oninput="onBankSearchInput(this.value)">
    <div class="filterGrid">
      <label>출처${sel('src', [["","전체 출처"],["변시","변시 기출 전체"],["모의","법전협 모의 전체"],...exams.map(e=>[e.tag, examShort(e)])], F.src)}</label>
      <label>정렬${sel('sort', [["toc","목차순"],["exam","회차순(오래된 순)"],["examDesc","회차순(최신 순)"],["wrong","오답 많은 순"],["rate","정답률 낮은 순"],["edited","최근 수정 순"]], F.sort)}</label>
      <label>대단원${sel('p1', [["","전체 대단원"],...Object.keys(tree).map(k=>[k,k])], F.p1)}</label>
      <label>중단원${sel('p2', [["","전체 중단원"],...p2opts.map(k=>[k,k])], F.p2)}</label>
      <label style="grid-column:1/-1">보기${sel('only', [["","전체 문제"],["edited","수정된 문제만"],["wrong","틀린 적 있는 문제"],["unsolved","안 푼 문제"],["bookmark","북마크한 문제"],["nopending","해설 없는 문제"]], F.only)}</label>
    </div>
    ${(F.src||F.p1||F.p2||F.only||S.search||F.sort!=='toc') ? `<button class="badge btn" style="margin-bottom:10px" onclick="S.bankF={src:'',p1:'',p2:'',only:'',sort:'toc'};S.search='';S.bankLimit=100;render()">↺ 조건 초기화</button>` : ''}
    <div id="bankListContainer">
      ${renderBankListItems()}
    </div>
  </section>
  ${bottom()}
  ${S.showAddModal ? addQuestionModal() : ''}
  `;
}

// ---------- 오답노트: 문제 클릭 → 팝업 ----------
function openQPopup(id){ S.qPopup = id; S.editingId = null; render(); }
function closeQPopup(){ S.qPopup = null; S.editingId = null; S.editDraft = null; render(); }
function qPopupView(){
  let q = bank.find(x => x.id === S.qPopup);
  if(!q) return "";
  let t = st(q.id), m = q.meta || {};
  let ans = q.noAnswer ? [] : parseAnswerTokens(q.answer);
  let editing = S.editingId === q.id;
  return `<div class="modalOverlay" onclick="if(event.target===this)closeQPopup()">
    <div class="modalContent">
      <div class="modalHeader">
        <b>${q.type==='ox'?'OX':'5지선다'} ${m.exam?'· '+esc(m.exam):''}</b>
        <div style="display:flex;gap:6px;align-items:center">
          ${editing ? '' : `<button class="badge btn" onclick="openEdit('${esc(q.id)}')">✏️ 수정</button>`}
          <button class="back" onclick="closeQPopup()">✕</button>
        </div>
      </div>
      <div class="modalBody">
        ${editing ? editForm() : `
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
            <span class="badge blue">${esc(q.category||'기본단원')}</span>
            ${q.multi?'<span class="badge warn">모두 고르시오</span>':''}
            ${q.noAnswer?'<span class="badge warn">상법 개정으로 정답 없음</span>':''}
          </div>
          <div style="white-space:pre-wrap;line-height:1.65;font-size:15px">${esc(q.text)}</div>
          ${q.type!=='ox' ? (q.choices||[]).map((c,i)=>{ let n=String(i+1), isA=ans.includes(n);
            return `<div class="resChoice ${isA?'isAns':''}">${n}. ${esc(c)}${isA?' ✅':''}</div>`; }).join('') : ''}
          <p style="margin:12px 0 4px">정답: <strong style="color:#173d2a;font-size:16px">${esc(ansLabel(q))}</strong></p>
          <p class="meta" style="margin:0">오답 ${t.wrong}회 · 풀이 ${t.attempts}회 · 연속 정답 ${t.streak||0}회${isGraduated(q.id)?' · 🎓 졸업':''}</p>
          <div class="explain"><b>해설</b><p>${explainHtml(q)}</p>${editorLine(q)}${srcLine(q)}</div>
          <div class="note"><b>내 메모</b><input value="${esc(notes[q.id] || "")}" placeholder="메모를 입력하세요" onchange="setNote('${esc(q.id)}',this.value)"></div>
        `}
      </div>
    </div>
  </div>`;
}
function wrongPage(){
  let all = bank.filter(q=>st(q.id).wrong>0 && (S.wrongType==='all' || q.type===S.wrongType));
  let grads = all.filter(q=>isGraduated(q.id));
  let active = all.filter(q=>!isGraduated(q.id));
  let arr = (S.showGraduated ? grads : active).slice().sort((a,b)=>st(b.id).wrong - st(a.id).wrong);
  let n = gradThreshold();
  return topBar("오답노트")+`<section class="title"><h1>오답노트</h1>
    <p>남은 오답 ${active.length}문제${n?` · 졸업 ${grads.length}문제 (연속 ${n}회 정답 시 졸업)`:' · 오답 졸업 사용 안 함'} · 문제를 누르면 정답·해설이 열립니다</p></section>
  <section class="section">
    <div class="segmentedControl" style="margin:0 0 10px">
      ${[["all","전체"],["ox","OX"],["mcq","5지선다"]].map(([k,nm])=>`<button class="${S.wrongType===k?'active':''}" onclick="S.wrongType='${k}';render()">${nm}</button>`).join('')}
    </div>
    ${n ? `<button class="secondary full" style="margin:0 0 12px" onclick="S.showGraduated=!S.showGraduated;render()">${S.showGraduated?'남은 오답 보기':'🎓 졸업한 문제 보기'}</button>` : ''}
  ${arr.length?arr.map(q=>{ let t=st(q.id); return `<div class="listItem clickable" onclick="openQPopup('${esc(q.id)}')">
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
      <span class="badge red">${q.type==='ox'?'OX':'5지선다'}</span>
      ${q.meta&&q.meta.exam?`<span class="badge gray">${esc(q.meta.exam)}</span>`:''}
      ${isGraduated(q.id)?`<span class="badge good">🎓 졸업</span>`:''}
      ${notes[q.id]?`<span class="badge blue">📝 메모</span>`:''}
    </div>
    <p style="white-space:pre-wrap;margin:6px 0"><b>${esc(q.text.length>220?q.text.slice(0,220)+'…':q.text)}</b></p>
    <small>오답 ${t.wrong}회 · 연속 정답 ${t.streak||0}회</small>
  </div>`;}).join(''):`<div class="empty">${S.showGraduated?'졸업한 문제가 없습니다.':'오답이 없습니다.'}</div>`}
  </section>${bottom()}${S.qPopup ? qPopupView() : ''}`;
}


// 1. 화면 즉시 렌더링
render();

// 2. 서버 데이터 비동기 로드
fetchBootstrap();
</script>
</body>
</html>
