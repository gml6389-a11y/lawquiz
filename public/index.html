<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Law Quiz v5.9 · 서버 연동 문제은행</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f4;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:860px;min-height:100vh;margin:auto;background:#fff;padding-bottom:90px;box-shadow:0 0 30px #0001}
.hero{padding:44px 25px 30px;background:linear-gradient(145deg,#102b1d,#214c35);color:#fff;border-radius:0 0 28px 28px}
.brand{font-weight:800;font-size:14px;margin-bottom:28px}.hero h1{font-size:32px;line-height:1.25;margin:0 0 10px;letter-spacing:-1.3px}
.hero p{margin:0;opacity:.82;font-size:14px;line-height:1.6}
.section{padding:14px 20px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:4}
.back{border:0;background:none;font-size:22px}.title{padding:26px 22px 10px}.title h1{margin:0 0 7px;font-size:26px}.title p{margin:0;color:#777;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f6f8f7;border-radius:14px;padding:14px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#777}
.group{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px;background:#fff}.group b{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips button{border:1px solid #dfe4e1;background:#f8faf9;border-radius:9px;padding:8px 12px;transition:0.15s;font-size:13px}
.chips button:hover{background:#eef3f0}
.chips button.active{background:#173d2a;color:#fff;border-color:#173d2a;font-weight:bold}
.primary,.secondary,.danger{border:0;border-radius:13px;padding:14px 17px;font-weight:800}.primary{background:#173d2a;color:#fff}.secondary{background:#edf0ee;color:#303532}.danger{background:#f8e8e8;color:#982f2f}.full{width:100%;margin-top:10px}
.card{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px}
.upload{border:2px dashed #b7c2bc;border-radius:18px;padding:28px;text-align:center;background:#fafcfb}.upload .ico{font-size:42px}
.file{margin:14px 0;background:#f0f3f1;border-radius:10px;padding:11px;text-align:left;font-size:13px}.hidden{display:none}
.notice{padding:13px 15px;border-radius:12px;background:#f5f7f6;color:#666;font-size:12px;line-height:1.6}
.notice.warn{background:#fff8e8;color:#76551a}.notice.good{background:#edf8f0;color:#245c35}.notice.bad{background:#fff2f2;color:#8b2c2c}
.progress{height:7px;background:#e7ebe8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#214c35;transition:.3s}
.reviewBox label{display:block;font-size:12px;color:#777;margin:14px 0 6px}.reviewBox input,.reviewBox textarea,.reviewBox select{width:100%;border:1px solid #dfe4e1;border-radius:10px;padding:11px;outline:none;line-height:1.55}
.row{display:flex;gap:9px}.row>*{flex:1}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#eef3f0;color:#31533f;font-size:11px;font-weight:800}
.badge.warn{background:#fff1cf;color:#805b16}.badge.red{background:#ffe8e8;color:#922e2e}.badge.blue{background:#e8f0ff;color:#28518b}.badge.gray{background:#f0f0f0;color:#555}
.badge.btn{cursor:pointer;border:1px solid #d5dad7}
.badge.btn:disabled{opacity:0.4;cursor:not-allowed}
.listItem{border:1px solid #e1e5e3;border-radius:14px;padding:15px;margin-bottom:10px}.listItem small{color:#777}.empty{text-align:center;color:#888;padding:60px 20px}
.qtext{font-size:20px;line-height:1.65;margin:18px 0 22px;white-space:pre-wrap}.answers{display:grid;gap:9px}
.answer{border:1px solid #dfe4e1;background:#fff;border-radius:13px;padding:14px 16px;text-align:left;line-height:1.5;transition:0.12s}
.answer.sel{border:2px solid #173d2a;background:#f2f7f4}
.result{margin-top:18px;padding:18px;border-radius:16px;background:#f5f8f6}.wrong{background:#fff7f7;border:1px solid #efd0d0}.correct{border:1px solid #cfe2d6}
.explain{border-top:1px solid #e2e6e3;margin-top:14px;padding-top:14px;line-height:1.65;white-space:pre-wrap}.note{margin-top:14px}.note input{width:100%;margin-top:6px;border:1px solid #dfe4e1;border-radius:9px;padding:10px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(860px,100%);height:70px;background:#fff;border-top:1px solid #e5e8e6;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.bottom button{border:0;background:#fff;color:#555}.bottom small{display:block;margin-top:4px;font-size:10px}
.meta{font-size:12px;color:#777;line-height:1.6}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.kpi>div{background:#f7f8f7;border-radius:12px;padding:12px}.kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:#777}
details{border:1px solid #e1e5e3;border-radius:12px;padding:10px 12px;margin-top:10px}summary{cursor:pointer;font-weight:700}
.search{width:100%;border:1px solid #dfe4e1;border-radius:11px;padding:11px}
.optionCard{border:2px solid #e1e5e3;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.optionCard.active{border-color:#173d2a;background:#f4f8f5}
.rangeWrap{margin:16px 0 10px}
.rangeWrap input[type=range]{width:100%;margin:10px 0;accent-color:#173d2a}

.tocBox{background:#fbfcfa;border:1px solid #dce4df;border-radius:14px;padding:14px;margin-bottom:10px}
.tocBoxHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed #e1e5e3}
.tocSubBox{background:#fff;border:1px solid #e8edea;border-radius:10px;padding:10px;margin-top:8px}

.segmentedControl{display:flex;background:#eaeeeb;border-radius:12px;padding:4px;gap:4px;margin-top:10px}
.segmentedControl button{flex:1;border:0;background:transparent;padding:12px 0;border-radius:9px;font-weight:700;font-size:13px;color:#555;transition:all 0.2s cubic-bezier(0.4,0,0.2,1)}
.segmentedControl button.active{background:#fff;color:#173d2a;box-shadow:0 2px 8px rgba(0,0,0,0.08)}

/* 타이머 UI */
.timerBox{background:#fff3f3;border:1px solid #ffd0d0;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.timerProgress{height:5px;background:#f0e3e3;border-radius:99px;overflow:hidden;margin-top:4px}
.timerProgress span{display:block;height:100%;background:#d94848;transition:0.1s linear}
.timerText{font-size:14px;font-weight:800;color:#c02b2b}

/* 모달 */
.modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modalContent{background:#fff;border-radius:20px;width:min(660px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 35px rgba(0,0,0,0.2)}
.modalHeader{padding:18px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modalBody{padding:18px 22px;overflow-y:auto;flex:1}
.modalFooter{padding:14px 22px;border-top:1px solid #eee;display:flex;gap:10px}

.colList{display:flex;flex-direction:column;gap:3px}
.colItem{width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:6px;font-size:12px;line-height:1.35;color:#333;cursor:pointer;word-break:break-all}
.colItem:hover{background:#f0f4f2}
.colItem.active{background:#173d2a;color:#fff;font-weight:bold}
.colItem small{opacity:0.8;font-size:11px}

/* 유효성 검사 에러 스타일 */
.inputError{border:2px solid #d94848 !important;background:#fff8f8 !important}
.errMsg{color:#c02b2b;font-size:11px;font-weight:700;margin-top:4px;display:block}
</style>
</head>
<body><div id="app"></div>
<script>
const SUBJECTS={
  "공법":["헌법","행정법"],
  "형사법":["형법","형사소송법"],
  "민사법":["민법","민사소송법","가족법","상법"]
};

// 최초 접속 시 DB가 비어있어도 화면이 즉시 렌더링되도록 기본 샘플 문제 1개 내장
const SAMPLE = [
  {
    id: "sample-1",
    number: "1",
    group: "공법",
    subject: "헌법",
    categoryPath: ["헌법총론", "기본원리"],
    category: "헌법총론 > 기본원리",
    type: "ox",
    text: "대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다.",
    choices: [],
    answer: "O",
    explanation: "대한민국 헌법 제1조 제2항 규정입니다.",
    incomplete: false,
    sourcePages: ""
  }
];

let bank = [...SAMPLE];
let stats = {};
let settings = {lastSubject:null, lastIndex:{}, lastId:{}};
let bookmarks = [];
let notes = {};
let masterMeta = {version:5, bookTitle:"LAW QUIZ 통합 문제은행", processing:{lastSourcePage:null,hasIncompleteQuestion:false,incompleteQuestionId:null}, warnings:[]};

let S = {
  screen:"home", files:[], pendingQuestions:[], pendingMetaList:[], queue:[], qi:0, selected:[], submitted:false,
  retryPrompt:false, retrying:false, subject:null, group:null,
  search:"", editingId:null, editDraft:null,
  setupGroup:null, setupSubject:null, setupMode:"resume",
  setupPath:[],
  setupLimit:20,
  setupOrder:"sequential",
  setupTimerEnabled:false,
  setupTimerSeconds:30,
  timeLeft:30,
  timerInterval:null,
  bankFilter:{
    sort:"default",
    subject:"전체",
    major:"전체",
    minor:"전체",
    detail:"전체"
  },
  showBankFilterModal:false,
  showAddModal:false,
  addDraft:null,
  addErrors:{}
};
let dirty = false;

// 서버에서 초기 데이터 로드
async function fetchBootstrap(){
  try {
    const res = await fetch('/api/bootstrap');
    if (!res.ok) throw new Error("서버 응답 오류: " + res.status);
    const data = await res.json();
    if (Array.isArray(data.bank) && data.bank.length > 0) {
      bank = data.bank;
    }
    stats = data.stats || {};
    bookmarks = data.bookmarks || [];
    notes = data.notes || {};
    settings = data.settings || {lastSubject:null,lastIndex:{},lastId:{}};
  } catch(e) {
    console.warn("서버 연결 대기 또는 오류:", e);
  } finally {
    render();
  }
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function st(id){return stats[id]||{attempts:0,correct:0,wrong:0,last:null}}
function render(){
  let fn={home,bankPage,importPage,quizPage,wrongPage,bookmarkPage,setupPage}[S.screen]||home;
  document.getElementById("app").innerHTML='<div class="app">'+fn()+'</div>';
}
function go(s){
  stopTimer();
  S.screen=s;
  render();
}
function topBar(t,b="home"){return `<header class="top"><button class="back" onclick="go('${b}')">←</button><b>${esc(t)}</b><span></span></header>`}

function extractCategoryPath(q, meta){
  if(Array.isArray(q.categoryPath) && q.categoryPath.length > 0){
    return q.categoryPath.filter(Boolean).map(x=>String(x).trim());
  }
  if(q.category && typeof q.category === "object"){
    return [q.category.major, q.category.minor, q.category.detail].filter(Boolean).map(x=>String(x).trim());
  }
  if(typeof q.category === "string" && q.category.trim()){
    return q.category.split(">").map(x=>x.trim()).filter(Boolean);
  }
  if(q.source && Array.isArray(q.source.tocPath) && q.source.tocPath.length > 0){
    return q.source.tocPath.filter(Boolean).map(x=>String(x).trim());
  }
  let fb = q.subcategory || q.subCategory || q.chapter || q.section || q.subSubject || meta?.category;
  if(typeof fb === "string" && fb.trim()) return [fb.trim()];
  return ["기본단원"];
}

function normalizeQuestion(q,i,meta){
  let type=q.type==="ox"?"ox":"mcq";
  let choices=Array.isArray(q.choices)?q.choices.map(x=>String(x??"")):[];
  let answer=String(q.answer??"").trim();
  if(type==="ox") answer=answer.toUpperCase();
  let categoryPath=extractCategoryPath(q, meta);
  let category=categoryPath.join(" > ");

  return {
    id:String(q.id||("import-"+Date.now()+"-"+i)),
    number:String(q.number??(i+1)),
    group:String(q.group||q.subjectGroup||meta.subjectGroup||""),
    subject:String(q.subject||meta.subject||""),
    categoryPath,
    category,
    type,text:String(q.text??q.question??""),
    choices,answer,
    explanation:String(q.explanation??""),
    incomplete:Boolean(q.incomplete),
    sourcePages:q.sourcePages==null?(q.source?.pages?String(q.source.pages):""):String(q.sourcePages)
  };
}

function issuesFor(nq){
  let reasons=[];
  if(!nq.text.trim()) reasons.push("본문 없음");
  if(nq.type==="mcq" && !nq.choices.length) reasons.push("선지 없음");
  if(nq.type==="ox" && !["O","X"].includes(nq.answer) && !nq.answer.includes("O") && !nq.answer.includes("X")) reasons.push("OX 정답 오류");
  if(!nq.subject) reasons.push("과목 정보 없음");
  return reasons;
}

function validateSingleFile(d){
  if(!d || typeof d!=="object") throw Error("JSON 객체 형식이 아닙니다.");
  if(!Array.isArray(d.questions)) throw Error("questions 배열이 없습니다.");
  let meta={...d};
  let qs=d.questions.map((q,i)=>{
    let nq=normalizeQuestion(q,i,d);
    nq.issues=issuesFor(nq);
    return nq;
  });
  return {meta,qs};
}

function subjectMap(){
  let map={};
  for(const g in SUBJECTS) map[g]=[...SUBJECTS[g]];
  for(const q of bank){
    let g=q.group||"미분류",s=q.subject||"미분류";
    if(!map[g]) map[g]=[];
    if(!map[g].includes(s)) map[g].push(s);
  }
  return map;
}

function buildTocTree(g, s){
  let arr = bank.filter(q=>(!g||q.group===g)&&q.subject===s);
  let root = {};
  for(let q of arr){
    let path = (q.categoryPath && q.categoryPath.length) ? q.categoryPath : ["기본단원"];
    let curr = root;
    for(let i=0; i<path.length; i++){
      let name = path[i];
      if(!curr[name]){
        curr[name] = { name, count: 0, path: path.slice(0, i+1), children: {} };
      }
      curr[name].count++;
      curr = curr[name].children;
    }
  }
  return root;
}

function progress(subject){
  let arr=bank.filter(q=>q.subject===subject);
  let solved=arr.filter(q=>st(q.id).attempts>0).length;
  return {n:arr.length,solved,rate:arr.length?Math.round(solved/arr.length*100):0};
}

function totals(){
  let vals=Object.values(stats);
  let attempted=vals.reduce((a,x)=>a+(x.attempts||0),0);
  let wrong=vals.reduce((a,x)=>a+(x.wrong||0),0);
  return {attempted,wrong,accuracy:attempted?Math.round((attempted-wrong)/attempted*100):0};
}

function shuffleArray(arr) {
  let array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function home(){
  let t=totals(), incomplete=bank.filter(q=>q.incomplete).length;
  return `<section class="hero">
    <div class="brand">⚖️ LAW QUIZ · 서버 연동 v5.9</div>
    <h1>나만의 법학<br>문제은행</h1>
    <p>실전 타이머 모드 & 서버 영구 보존</p>
  </section>
  <section class="section">
    <div class="stats">
      <div class="stat"><b>${bank.length}</b><span>문제은행</span></div>
      <div class="stat"><b>${t.attempted}</b><span>누적 풀이</span></div>
      <div class="stat"><b>${t.accuracy}%</b><span>누적 정답률</span></div>
    </div>
  </section>
  ${incomplete?`<section class="section"><div class="notice warn">⚠️️ 아직 연결되지 않은 경계 문제가 ${incomplete}개 있습니다.</div></section>`:""}
  <section class="title"><h1>과목 선택</h1><p>과목을 선택하여 세부 목차와 풀이량을 지정하세요.</p></section>
  <section class="section">
    ${(()=>{let map=subjectMap();return Object.keys(map).map(g=>`<div class="group"><b>${esc(g)}</b>${!SUBJECTS[g]?` <span class="badge warn">미등록 그룹</span>`:""}<div class="chips">${map[g].map(s=>{
      let p=progress(s);let known=SUBJECTS[g]&&SUBJECTS[g].includes(s);
      return `<button onclick="openSetup('${esc(g)}','${esc(s)}')">${esc(s)}${known?"":" 🆕"} <small>${p.solved}/${p.n}</small></button>`;
    }).join("")}</div></div>`).join("")})()}
  </section>
  <section class="section">
    <button class="primary full" onclick="go('importPage')">📥 JSON 문제 파일 불러오기 (서버 업로드)</button>
    <button class="${dirty?"primary":"secondary"} full" onclick="exportMaster()">📤 현재 전체 문제은행 JSON 다운로드</button>
    <button class="secondary full" onclick="exportProgress()">💾 학습기록 백업</button>
    <button class="secondary full" onclick="document.getElementById('restore').click()">📂 학습기록 복원</button>
    <input id="restore" type="file" accept=".json,application/json" class="hidden" onchange="restoreProgress(this)">
    <button class="danger full" onclick="resetProgress()">🗑️️ 학습기록 초기화 (리셋)</button>
  </section>
  ${bottom()}
  `;
}

function openSetup(g,s){
  let arr=bank.filter(q=>q.group===g&&q.subject===s);
  if(!arr.length){alert("이 과목에는 문제가 없습니다.");return}
  S.setupGroup=g;
  S.setupSubject=s;
  S.setupMode="resume";
  S.setupPath=[];
  S.setupLimit=20;
  S.setupOrder="sequential";
  S.setupTimerEnabled=false;
  S.setupTimerSeconds=30;
  S.screen="setupPage";
  render();
}

function matchesPath(q, path){
  if(!path || !path.length) return true;
  if(!q.categoryPath || !q.categoryPath.length) return false;
  for(let i=0; i<path.length; i++){
    if(q.categoryPath[i] !== path[i]) return false;
  }
  return true;
}

function isPathEqual(p1, p2){
  if(!p1 && !p2) return true;
  if(!p1 || !p2) return false;
  if(p1.length !== p2.length) return false;
  return p1.every((v,i)=>v===p2[i]);
}

function renderTocTree(tree){
  let topKeys = Object.keys(tree);
  if(!topKeys.length) return `<div class="meta">등록된 목차가 없습니다.</div>`;

  return topKeys.map(k1=>{
    let node1 = tree[k1];
    let isNode1Sel = isPathEqual(S.setupPath, node1.path);
    let subKeys = Object.keys(node1.children);

    return `<div class="tocBox">
      <div class="tocBoxHeader">
        <b style="font-size:15px">📁 ${esc(node1.name)} <small style="color:#777">(${node1.count})</small></b>
        <button class="badge btn ${isNode1Sel?'blue':''}" onclick="S.setupPath=${JSON.stringify(node1.path).replace(/"/g,"'")};render()">
          ${isNode1Sel ? "✓ 선택됨" : "중단원 전체 풀기"}
        </button>
      </div>
      ${subKeys.length ? `
        <div class="chips">
          ${subKeys.map(k2=>{
            let node2 = node1.children[k2];
            let isNode2Sel = isPathEqual(S.setupPath, node2.path);
            let subSubKeys = Object.keys(node2.children);

            if(subSubKeys.length > 0){
              return `<div class="tocSubBox" style="width:100%">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                  <span style="font-size:13px;font-weight:700">${esc(node2.name)} (${node2.count})</span>
                  <button class="badge btn ${isNode2Sel?'blue':''}" onclick="S.setupPath=${JSON.stringify(node2.path).replace(/"/g,"'")};render()">${isNode2Sel ? "✓ 선택됨" : "전체"}</button>
                </div>
                <div class="chips">
                  ${subSubKeys.map(k3=>{
                    let node3 = node2.children[k3];
                    let isNode3Sel = isPathEqual(S.setupPath, node3.path);
                    return `<button class="${isNode3Sel?'active':''}" onclick="S.setupPath=${JSON.stringify(node3.path).replace(/"/g,"'")};render()">${esc(node3.name)} <small>(${node3.count})</small></button>`;
                  }).join("")}
                </div>
              </div>`;

            }
          }).join("")}
        </div>
      `:""}
    </div>`;
  }).join("");
}

function startCustomQuiz(){
  let g=S.setupGroup, s=S.setupSubject;
  let allArr=bank.filter(q=>q.group===g&&q.subject===s);
  let queue=[];

  if(S.setupMode==="resume"){
    let lastId=settings.lastId[s];
    let lastIdx=lastId?allArr.findIndex(q=>q.id===lastId):-1;
    if(lastIdx<0) lastIdx=settings.lastIndex[s]||0;
    let slice=allArr.slice(lastIdx);
    if(!slice.length) slice=allArr;
    
    if(S.setupOrder==="random") slice = shuffleArray(slice);
    let limit=S.setupLimit==="all"?slice.length:parseInt(S.setupLimit,10);
    queue=slice.slice(0,limit);
  }else{
    let filtered=allArr.filter(q=>matchesPath(q, S.setupPath));
    if(S.setupOrder==="random") filtered = shuffleArray(filtered);
    let limit=S.setupLimit==="all"?filtered.length:parseInt(S.setupLimit,10);
    queue=filtered.slice(0,limit);
  }

  if(!queue.length){alert("선택하신 단원에 문제가 없습니다.");return}

  S.group=g;
  S.subject=s;
  S.queue=queue;
  S.qi=0;
  S.selected=[];
  S.submitted=false;
  S.retryPrompt=false;
  S.retrying=false;
  S.screen="quizPage";
  render();
  startTimerIfNeeded();
}

function parseAnswerTokens(ans){
  if(!ans) return [];
  if(Array.isArray(ans)) return ans.map(x=>String(x).trim());
  let s = String(ans);
  const circled = {'①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑩':'10'};
  s = s.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, m => circled[m] || m);
  return s.split(/[,/ ]+/).map(x=>x.trim()).filter(Boolean);
}

function checkAnswerCorrect(selected, answer){
  let user = (Array.isArray(selected) ? selected : [selected]).map(x=>String(x).trim()).filter(Boolean).sort();
  let corr = parseAnswerTokens(answer).sort();
  if(!corr.length) return false;
  if(user.length !== corr.length) return false;
  return user.every((v, i) => v.toUpperCase() === corr[i].toUpperCase());
}

function stopTimer(){
  if(S.timerInterval){
    clearInterval(S.timerInterval);
    S.timerInterval = null;
  }
}

function startTimerIfNeeded(){
  stopTimer();
  if(!S.setupTimerEnabled || S.submitted || S.screen !== "quizPage") return;

  S.timeLeft = S.setupTimerSeconds;
  updateTimerUI();

  S.timerInterval = setInterval(()=>{
    S.timeLeft--;
    updateTimerUI();
    if(S.timeLeft <= 0){
      stopTimer();
      alert("⏰ 제한시간이 종료되었습니다! 오답 처리됩니다.");
      submitQ(true);
    }
  }, 1000);
}

function updateTimerUI(){
  let el = document.getElementById("timerDisplay");
  let bar = document.getElementById("timerProgressBar");
  if(el) el.innerText = `${S.timeLeft}초`;
  if(bar){
    let pct = Math.max(0, (S.timeLeft / S.setupTimerSeconds) * 100);
    bar.style.width = pct + "%";
  }
}

function prevQ(){
  if(S.qi > 0){
    stopTimer();
    S.qi--;
    S.selected = [];
    S.submitted = false;
    S.retryPrompt = false;
    S.retrying = false;
    render();
    startTimerIfNeeded();
  }
}

function passQ(){
  stopTimer();
  if(S.qi < S.queue.length - 1){
    S.qi++;
    S.selected = [];
    S.submitted = false;
    S.retryPrompt = false;
    S.retrying = false;
    render();
    startTimerIfNeeded();
  }else{
    alert("세트 내 문제를 모두 확인했습니다. 패스한 문제는 미풀이 상태로 보존됩니다.");
    go("home");
  }
}

function choose(a){
  if(S.submitted) return;
  let q = S.queue[S.qi];
  let isBinary = (q.type === "ox" || (q.choices && q.choices.length <= 2));

  if(isBinary){
    S.selected = [String(a)];
  } else {
    if(!Array.isArray(S.selected)) S.selected = [];
    let str = String(a);
    let idx = S.selected.indexOf(str);
    if(idx >= 0){
      S.selected.splice(idx, 1);
    } else {
      S.selected.push(str);
      S.selected.sort((x,y)=>parseInt(x,10)-parseInt(y,10));
    }
  }
  render();
}

async function submitQ(isTimeout = false){
  stopTimer();
  let q=S.queue[S.qi];
  let c = isTimeout ? false : checkAnswerCorrect(S.selected, q.answer);
  let x=st(q.id);
  x.attempts++;x.last=new Date().toISOString();
  if(c)x.correct++;else x.wrong++;
  stats[q.id]=x;
  settings.lastSubject=S.subject;
  settings.lastId[S.subject]=q.id;
  
  let fullArr=bank.filter(item=>item.subject===S.subject);
  let globalIdx=fullArr.findIndex(item=>item.id===q.id);
  if(globalIdx>=0) settings.lastIndex[S.subject]=globalIdx;
  
  fetch('/api/stats', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: q.id, isCorrect: c, settings })
  });

  S.submitted=true;
  if(!c && !S.retrying && !isTimeout) S.retryPrompt=true;
  render();
}

function retryQ(){
  S.selected=[];
  S.submitted=false;
  S.retryPrompt=false;
  S.retrying=true;
  render();
  startTimerIfNeeded();
}

function showAns(){S.retryPrompt=false;S.submitted=true;render()}

function nextQ(){
  stopTimer();
  if(S.qi<S.queue.length-1){
    S.qi++;S.selected=[];S.submitted=false;S.retryPrompt=false;S.retrying=false;
    settings.lastId[S.subject]=S.queue[S.qi].id;
    render();
    startTimerIfNeeded();
  }else{
    alert("설정한 문제 세트를 모두 완수했습니다!");
    go("home");
  }
}

function toggleBook(id){
  let willBook = !bookmarks.includes(id);
  bookmarks = willBook ? [...bookmarks, id] : bookmarks.filter(x=>x!==id);
  fetch('/api/bookmark', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, isBookmarked: willBook })
  });
  render();
}

function setNote(id,v){
  notes[id]=v;
  fetch('/api/note', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, note: v })
  });
}

async function resetProgress(){
  if(!confirm("모든 학습기록(풀이 횟수, 정답률, 이어풀기 위치, 북마크, 메모)을 초기화하시겠습니까?\n\n※ 등록된 문제 데이터는 삭제되지 않습니다.")) return;

// ---------------- 문제은행 필터 & 3단 목차 탐색기 ----------------
function getFilteredBankQuestions(){
  let qList = bank.filter(q=>{
    if(S.search){
      let qText = (`${q.text} ${q.subject} ${q.group} ${q.category}`).toLowerCase();
      if(!qText.includes(S.search.toLowerCase())) return false;
    }
    if(S.bankFilter.subject && S.bankFilter.subject !== "전체"){
      if(q.subject !== S.bankFilter.subject) return false;
    }
    if(S.bankFilter.major && S.bankFilter.major !== "전체"){
      let qMaj = q.categoryPath?.[0] || "기본단원";
      if(qMaj !== S.bankFilter.major) return false;
    }
    if(S.bankFilter.minor && S.bankFilter.minor !== "전체"){
      let qMin = q.categoryPath?.[1] || "";
      if(qMin !== S.bankFilter.minor) return false;
    }
    if(S.bankFilter.detail && S.bankFilter.detail !== "전체"){
      let qDet = q.categoryPath?.[2] || "";
      if(qDet !== S.bankFilter.detail) return false;
    }
    if(S.bankFilter.sort === "unsolved" && st(q.id).attempts > 0) return false;
    if(S.bankFilter.sort === "bookmark" && !bookmarks.includes(q.id)) return false;
    return true;
  });

  if(S.bankFilter.sort === "wrong"){
    qList.sort((a,b)=> st(b.id).wrong - st(a.id).wrong);
  } else if(S.bankFilter.sort === "rate_asc"){
    qList.sort((a,b)=>{
      let sa = st(a.id), sb = st(b.id);
      let ra = sa.attempts ? sa.correct/sa.attempts : 1;
      let rb = sb.attempts ? sb.correct/sb.attempts : 1;
      return ra - rb;
    });
  }
  return qList;
}

function renderBankListItems(){
  let filtered = getFilteredBankQuestions();
  if(!filtered.length) return `<div class="empty">조건에 해당하는 문제가 없습니다.</div>`;

  return filtered.map((q,i)=>{
    if(S.editingId===q.id) return `<div class="listItem">${editForm()}</div>`;
    let t=st(q.id);
    return `<div class="listItem">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
        <span class="badge">${esc(q.group)} · ${esc(q.subject)}</span>
        <span class="badge blue">${esc(q.category||"기본단원")}</span>
        ${q.incomplete?` <span class="badge warn">경계 미완성</span>`:""}
        ${q.issues&&q.issues.length?` <span class="badge red">데이터 오류</span>`:""}

function openAddModal(){
  let sMap = subjectMap();
  let groups = Object.keys(sMap);
  let defaultGroup = groups[0] || "공법";
  let defaultSubj = (sMap[defaultGroup] && sMap[defaultGroup][0]) || "헌법";

  S.addDraft = {
    group: defaultGroup,
    customGroup: "",
    subject: defaultSubj,
    customSubject: "",
    catMode: "select",
    selectedMajor: "",
    selectedMinor: "",
    selectedDetail: "",
    customCategory: "",
    type: "ox",
    text: "",
    choices: ["", "", "", ""],
    answer: "O",
    explanation: ""
  };
  S.addErrors = {};
  initAddDraftCategory();
  S.showAddModal = true;
  render();
}

function initAddDraftCategory(){
  let d = S.addDraft;
  if(!d) return;
  let s = d.subject === "직접입력" ? d.customSubject.trim() : d.subject;
  let tree = buildTocTree(d.group === "직접입력" ? "" : d.group, s);
  let majorKeys = Object.keys(tree);

  if(majorKeys.length > 0){
    d.catMode = "select";
    d.selectedMajor = majorKeys[0];
    let minors = Object.keys(tree[d.selectedMajor]?.children || {});
    d.selectedMinor = minors[0] || "";
    let details = d.selectedMinor ? Object.keys(tree[d.selectedMajor].children[d.selectedMinor]?.children || {}) : [];
    d.selectedDetail = details[0] || "";
  } else {
    d.catMode = "custom";
    d.customCategory = "";
  }
}

function closeAddModal(){
  S.showAddModal = false;
  S.addDraft = null;
  S.addErrors = {};
  render();
}

function updateAddField(f, val){
  if(!S.addDraft) return;
  S.addDraft[f] = val;
  if(S.addErrors[f]) delete S.addErrors[f];
}

function onAddGroupChange(val){
  if(!S.addDraft) return;
  S.addDraft.group = val;
  if(val !== "직접입력"){
    let sMap = subjectMap();
    let subjs = sMap[val] || [];
    S.addDraft.subject = subjs[0] || "직접입력";
  } else {
    S.addDraft.subject = "직접입력";
  }
  if(S.addErrors.group) delete S.addErrors.group;
  if(S.addErrors.subject) delete S.addErrors.subject;
  initAddDraftCategory();
  render();
}

function onAddSubjectChange(val){
  if(!S.addDraft) return;
  S.addDraft.subject = val;
  if(S.addErrors.subject) delete S.addErrors.subject;
  initAddDraftCategory();
  render();
}

function onAddMajorChange(val){

  if(val === "_custom_"){
    S.addDraft.catMode = "custom";

async function submitNewQuestion(){
  let d = S.addDraft;
  if(!d) return;

  let errors = {};
  let finalGroup = d.group === "직접입력" ? d.customGroup.trim() : d.group.trim();
  let finalSubject = d.subject === "직접입력" ? d.customSubject.trim() : d.subject.trim();

  // 1. 그룹 및 과목 검증
  if(!finalGroup) errors.group = "과목 분류(그룹)를 입력하거나 선택해 주세요.";
  if(!finalSubject) errors.subject = "과목명을 입력하거나 선택해 주세요.";

  // 2. 본문 검증
  if(!d.text.trim()) errors.text = "문제 본문 내용을 입력해 주세요.";

  // 3. 선지 검증 (객관식)
  if(d.type === "mcq"){
    let validChoices = d.choices.map(c=>c.trim()).filter(Boolean);
    if(!validChoices.length){
      errors.choices = "객관식 보기를 최소 1개 이상 입력해야 합니다.";
    }
  }

  // 4. 정답 검증
  let cleanAns = d.answer.trim();
  if(!cleanAns){
    errors.answer = "정답을 입력해 주세요.";
  } else if(d.type === "ox" && !["O","X"].includes(cleanAns.toUpperCase())){
    errors.answer = "OX 문제는 정답을 O 또는 X로 지정해야 합니다.";
  }

  if(Object.keys(errors).length > 0){
    S.addErrors = errors;
    alert("⚠️ 필수 기재 항목이 누락되었습니다. 붉은색 입력창을 확인해 주세요.");
    render();
    return;
  }

  // 5. 단원 카테고리 구성
  let catPath = [];
  if(d.catMode === "select" && d.selectedMajor){
    catPath = [d.selectedMajor, d.selectedMinor, d.selectedDetail].filter(Boolean).map(x=>x.trim());
  } else {
    let cat = d.customCategory.trim() || "기본단원";
    catPath = cat.split(">").map(x=>x.trim()).filter(Boolean);
  }
  if(!catPath.length) catPath = ["기본단원"];

  let finalChoices = d.type === "mcq" ? d.choices.map(c=>c.trim()).filter(Boolean) : [];

  let newQ = {
    id: "custom-" + Date.now(),
    number: String(bank.length + 1),
    group: finalGroup || "기타",
    subject: finalSubject,
    categoryPath: catPath,
    category: catPath.join(" > "),
    type: d.type,
    text: d.text.trim(),
    choices: finalChoices,
    answer: d.type === "ox" ? cleanAns.toUpperCase() : cleanAns,
    explanation: d.explanation.trim() || "(해설이 없습니다.)",
    incomplete: false,
    sourcePages: ""
  };
  newQ.issues = issuesFor(newQ);

  await fetch('/api/question', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(newQ)
  });

  bank.push(newQ);
  alert(`✅ 문제가 성공적으로 등록되었습니다!\n[${newQ.group} > ${newQ.subject}] ${newQ.category}\n정답: ${newQ.answer}`);
  closeAddModal();
}

function multipleFilesChosen(input){
  let fileList = Array.from(input.files || []);
  if(!fileList.length) return;
  S.files = fileList;
  S.pendingQuestions = [];
  S.pendingMetaList = [];

  let readPromises = fileList.map(f=>{
    return new Promise((resolve, reject)=>{
      let r = new FileReader();
      r.onload = ()=>{
        try {
          let d = JSON.parse(r.result);
          let {meta, qs} = validateSingleFile(d);
          resolve({meta, qs});
        } catch(e) {
          reject(new Error(`[${f.name}] ${e.message}`));
        }
      };
      r.readAsText(f);
    });
  });

  Promise.all(readPromises).then(results=>{
    let allQs = [];
    results.forEach(res=>{
      S.pendingMetaList.push(res.meta);
      allQs.push(...res.qs);
    });
    let seen = new Set();
    allQs.forEach((q, idx)=>{
      if(seen.has(q.id)){
        q.id = q.id + "_dup" + idx;
      }
      seen.add(q.id);
    });
    S.pendingQuestions = allQs;
    render();
  }).catch(err=>{
    alert("파일 읽기 오류: " + err.message);
    clearImport();
  });
}

async function applyImport(mode){
  if(!S.pendingQuestions.length) return;

  if(mode === 'replace'){
    if(!confirm("서버의 모든 문제가 삭제되고 선택한 파일의 문제로 대체됩니다. 계속하시겠습니까?")) return;
  }

  const res = await fetch('/api/import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ questions: S.pendingQuestions, mode })
  });
  const data = await res.json();
  
  alert(`서버 업데이트 완료! (${data.count}문제 반영됨)`);
  clearImport();
  await fetchBootstrap();
  go('home');
}

function updateEditField(field,v){if(S.editDraft)S.editDraft[field]=v}

function updateEditChoice(i,v){if(S.editDraft)S.editDraft.choices[i]=v}

async function saveEdit(){
  let q=bank.find(x=>x.id===S.editingId);
  if(!q||!S.editDraft)return;
  let d=S.editDraft;
  q.number=String(d.number??q.number);
  q.group=String(d.group??"");
  q.subject=String(d.subject??"");
  q.category=String(d.category??"기본단원");
  q.categoryPath=q.category.split(">").map(x=>x.trim()).filter(Boolean);
  q.type=d.type==="ox"?"ox":"mcq";
  q.text=String(d.text??"");
  q.choices=q.type==="mcq"?d.choices.map(c=>String(c??"")):[];
  q.answer=q.type==="ox"?String(d.answer??"").toUpperCase():String(d.answer??"");
  q.explanation=String(d.explanation??"");
  q.issues=issuesFor(q);

  await fetch('/api/question', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(q)
  });

  if(S.queue&&S.queue.length){
    let qi=S.queue.findIndex(x=>x.id===q.id);
    if(qi>=0)S.queue[qi]=q;
  }
  S.editingId=null;S.editDraft=null;
  render();
  startTimerIfNeeded();
}

async function deleteQuestion(id){
  if(!confirm("이 문제를 서버 DB에서 영구 삭제하시겠습니까?"))return;
  await fetch(`/api/question/${id}`, { method: 'DELETE' });
  
  bank=bank.filter(q=>q.id!==id);
  delete stats[id];
  bookmarks=bookmarks.filter(x=>x!==id);
  delete notes[id];
  
  S.editingId=null;S.editDraft=null;
  if(S.queue&&S.queue.length){
    let wasIdx=S.queue.findIndex(q=>q.id===id);
    S.queue=S.queue.filter(q=>q.id!==id);
    if(!S.queue.length){alert("남은 문제가 없습니다.");go("home");return}
    if(wasIdx>=0){
      S.qi=Math.min(S.qi,S.queue.length-1);
      S.selected=[];S.submitted=false;S.retryPrompt=false;S.retrying=false;
    }
  }
  render();
  startTimerIfNeeded();
}

    })),
    warnings:Array.isArray(masterMeta.warnings)?masterMeta.warnings:[],
    exportedAt:new Date().toISOString()
  };
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="master_questions_all_"+new Date().toISOString().slice(0,10)+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function exportProgress(){
  let data={version:5,exportedAt:new Date().toISOString(),stats,settings,bookmarks,notes};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="lawquiz_progress_all_"+new Date().toISOString().slice(0,10)+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function restoreProgress(input){
  let f=input.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let d=JSON.parse(r.result);
      if(!d.stats||!d.settings)throw Error("학습기록 JSON 형식이 아닙니다.");
      stats=d.stats;settings=d.settings;bookmarks=Array.isArray(d.bookmarks)?d.bookmarks:[];notes=d.notes||{};
      alert("학습기록을 불러왔습니다.");render();
    }catch(e){alert("복원 실패: "+e.message)}
  };
  r.readAsText(f);
}

// 1. 화면 즉시 렌더링 (흰 화면 방지)
render();

// 2. 서버 DB 데이터 비동기 로드
fetchBootstrap();
</script>
</body>
