<body><div id="app"></div>
<script>
const SUBJECTS={
  "공법":["헌법","행정법"],
  "형사법":["형법","형사소송법"],
  "민사법":["민법","민사소송법","가족법","상법"]
};

const SAMPLE = [
  {
    id: "sample-1",
    number: "1",
    group: "공법",
    subject: "헌법",
    categoryPath: ["헌법총론", "기본원리"],
    category: "헌법총론 > 기본원리",
    type: "ox",
    text: "대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다.",
    choices: [],
    answer: "O",
    explanation: "대한민국 헌법 제1조 제2항 규정입니다.",
    incomplete: false,
    sourcePages: ""
  }
];

let bank = [...SAMPLE];
let stats = {};
let settings = {lastSubject:null, lastIndex:{}, lastId:{}};
let bookmarks = [];
let notes = {};
let masterMeta = {version:6, bookTitle:"LAW QUIZ 통합 문제은행", processing:{lastSourcePage:null,hasIncompleteQuestion:false,incompleteQuestionId:null}, warnings:[]};

let currentUser = localStorage.getItem("law_quiz_user") || null;

let S = {
  screen:"home", files:[], pendingQuestions:[], pendingMetaList:[], queue:[], qi:0, selected:[], submitted:false,
  retryPrompt:false, retrying:false, subject:null, group:null,
  search:"", editingId:null, editDraft:null,
  setupGroup:null, setupSubject:null, setupMode:"resume",
  setupPath:[],
  setupLimit:20,
  setupOrder:"sequential",
  setupTimerEnabled:false,
  setupTimerSeconds:30,
  timeLeft:30,
  timerInterval:null,
  bankFilter:{
    sort:"default",
    subject:"전체",
    major:"전체",
    minor:"전체",
    detail:"전체"
  },
  showBankFilterModal:false,
  showAddModal:false,
  addDraft:null,
  addErrors:{},

  // 테스트 모드 상태
  testSubject: "헌법",
  testGroup: "공법",
  testPath: [],
  testLimit: 20,
  testMinutes: 30,
  testQueue: [],
  testQi: 0,
  testAnswers: {},
  testTimeSpent: {},
  testTimeLeft: 0,
  testTimerInterval: null,
  testCurrentEnterTime: 0,
  testResultData: null,

  // 계정 모달
  showAuthModal: false,
  authUsername: "",
  authPassword: "",
  authError: ""
};
let dirty = false;

// 서버에서 데이터 로드 (계정별 분리)
async function fetchBootstrap(){
  try {
    const url = currentUser ? `/api/bootstrap?username=${encodeURIComponent(currentUser)}` : `/api/bootstrap`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("서버 응답 오류: " + res.status);
    const data = await res.json();
    if (Array.isArray(data.bank) && data.bank.length > 0) {
      bank = data.bank;
    }
    stats = data.stats || {};
    bookmarks = data.bookmarks || [];
    notes = data.notes || {};
    settings = data.settings || {lastSubject:null,lastIndex:{},lastId:{}};
  } catch(e) {
    console.warn("서버 연결 대기 또는 로컬 오프라인 모드:", e);
  } finally {
    render();
  }
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function st(id){return stats[id]||{attempts:0,correct:0,wrong:0,last:null}}
function render(){
  let fn={home,bankPage,importPage,quizPage,wrongPage,bookmarkPage,setupPage,testSetupPage,testPlayPage,testResultPage}[S.screen]||home;
  document.getElementById("app").innerHTML='<div class="app">'+fn()+'</div>';
}
function go(s){
  stopTimer();
  stopTestTimer();
  S.screen=s;
  render();
}
function topBar(t,b="home"){return `<header class="top"><button class="back" onclick="go('${b}')">←</button><b>${esc(t)}</b><span></span></header>`}

// 인증 로직
function openAuthModal(){
  S.authUsername = "";
  S.authPassword = "";
  S.authError = "";
  S.showAuthModal = true;
  render();
}
function closeAuthModal(){
  S.showAuthModal = false;
  render();
}
async function submitAuth(){
  if(!S.authUsername.trim() || !S.authPassword.trim()){
    S.authError = "이름과 비밀번호를 모두 입력하세요.";
    render();
    return;
  }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: S.authUsername.trim(), password: S.authPassword.trim() })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "인증 실패");

    currentUser = data.username;
    localStorage.setItem("law_quiz_user", currentUser);
    alert(data.isNew ? `🎉 신규 사용자 [${currentUser}]님 환영합니다! 계정이 생성되었습니다.` : `👋 [${currentUser}]님 로그인되었습니다.`);
    closeAuthModal();
    await fetchBootstrap();
  } catch(err){
    S.authError = err.message;
    render();
  }
}
function logoutUser(){
  if(!confirm("로그아웃 하시겠습니까?\n로그아웃 시 개인 학습기록 저장이 중단되고 게스트 모드로 전환됩니다.")) return;
  currentUser = null;
  localStorage.removeItem("law_quiz_user");
  stats = {};
  bookmarks = [];
  notes = {};
  alert("로그아웃되었습니다.");
  fetchBootstrap();
}

function authModalView(){
  return `<div class="modalOverlay" onclick="if(event.target===this)closeAuthModal()">
    <div class="modalContent" style="max-width:400px">
      <div class="modalHeader">
        <b>👤 학습자 로그인 / 등록</b>
        <button class="back" onclick="closeAuthModal()">✕</button>
      </div>
      <div class="modalBody reviewBox">
        <p class="meta" style="margin-top:0">이름과 비밀번호를 입력하면 계정별로 오답·북마크·풀이 기록이 분리 보존됩니다. (최초 입력 시 자동 계정 생성)</p>
        <label>사용자 이름 (아이디)</label>
        <input placeholder="이름을 입력하세요" value="${esc(S.authUsername)}" oninput="S.authUsername=this.value">
        <label>비밀번호</label>
        <input type="password" placeholder="비밀번호" value="${esc(S.authPassword)}" oninput="S.authPassword=this.value">
        ${S.authError ? `<span class="errMsg">⚠️ ${esc(S.authError)}</span>` : ''}
      </div>
      <div class="modalFooter">
        <button class="secondary" style="flex:1" onclick="closeAuthModal()">취소</button>
        <button class="primary" style="flex:2" onclick="submitAuth()">로그인 / 생성</button>
      </div>
    </div>
  </div>`;
}

function extractCategoryPath(q, meta){
  if(Array.isArray(q.categoryPath) && q.categoryPath.length > 0){
    return q.categoryPath.filter(Boolean).map(x=>String(x).trim());
  }
  if(q.category && typeof q.category === "object"){
    return [q.category.major, q.category.minor, q.category.detail].filter(Boolean).map(x=>String(x).trim());
  }
  if(typeof q.category === "string" && q.category.trim()){
    return q.category.split(">").map(x=>x.trim()).filter(Boolean);
  }
  return ["기본단원"];
}

function normalizeQuestion(q,i,meta){
  let type=q.type==="ox"?"ox":"mcq";
  let choices=Array.isArray(q.choices)?q.choices.map(x=>String(x??"")):[];
  let answer=String(q.answer??"").trim();
  if(type==="ox") answer=answer.toUpperCase();
  let categoryPath=extractCategoryPath(q, meta);
  let category=categoryPath.join(" > ");

  return {
    id:String(q.id||("import-"+Date.now()+"-"+i)),
    number:String(q.number??(i+1)),
    group:String(q.group||q.subjectGroup||meta.subjectGroup||""),
    subject:String(q.subject||meta.subject||""),
    categoryPath,
    category,
    type,text:String(q.text??q.question??""),
    choices,answer,
    explanation:String(q.explanation??""),
    incomplete:Boolean(q.incomplete),
    sourcePages:q.sourcePages==null?(q.source?.pages?String(q.source.pages):""):String(q.sourcePages)
  };
}

function issuesFor(nq){
  let reasons=[];
  if(!nq.text.trim()) reasons.push("본문 없음");
  if(nq.type==="mcq" && !nq.choices.length) reasons.push("선지 없음");
  if(nq.type==="ox" && !["O","X"].includes(nq.answer) && !nq.answer.includes("O") && !nq.answer.includes("X")) reasons.push("OX 정답 오류");
  if(!nq.subject) reasons.push("과목 정보 없음");
  return reasons;
}

function validateSingleFile(d){
  if(!d || typeof d!=="object") throw Error("JSON 객체 형식이 아닙니다.");
  if(!Array.isArray(d.questions)) throw Error("questions 배열이 없습니다.");
  let meta={...d};
  let qs=d.questions.map((q,i)=>{
    let nq=normalizeQuestion(q,i,d);
    nq.issues=issuesFor(nq);
    return nq;
  });
  return {meta,qs};
}

function subjectMap(){
  let map={};
  for(const g in SUBJECTS) map[g]=[...SUBJECTS[g]];
  for(const q of bank){
    let g=q.group||"미분류",s=q.subject||"미분류";
    if(!map[g]) map[g]=[];
    if(!map[g].includes(s)) map[g].push(s);
  }
  return map;
}

function buildTocTree(g, s){
  let arr = bank.filter(q=>(!g||q.group===g)&&q.subject===s);
  let root = {};
  for(let q of arr){
    let path = (q.categoryPath && q.categoryPath.length) ? q.categoryPath : ["기본단원"];
    let curr = root;
    for(let i=0; i<path.length; i++){
      let name = path[i];
      if(!curr[name]){
        curr[name] = { name, count: 0, path: path.slice(0, i+1), children: {} };
      }
      curr[name].count++;
      curr = curr[name].children;
    }
  }
  return root;
}

function progress(subject){
  let arr=bank.filter(q=>q.subject===subject);
  let solved=arr.filter(q=>st(q.id).attempts>0).length;
  return {n:arr.length,solved,rate:arr.length?Math.round(solved/arr.length*100):0};
}

function totals(){
  let vals=Object.values(stats);
  let attempted=vals.reduce((a,x)=>a+(x.attempts||0),0);
  let wrong=vals.reduce((a,x)=>a+(x.wrong||0),0);
  return {attempted,wrong,accuracy:attempted?Math.round((attempted-wrong)/attempted*100):0};
}

function shuffleArray(arr) {
  let array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function home(){
  let t=totals(), incomplete=bank.filter(q=>q.incomplete).length;
  return `<section class="hero">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="brand">⚖️ LAW QUIZ · v6.0</div>
      <div>
        ${currentUser ? `
          <button class="badge btn" style="background:#fff;color:#173d2a;font-weight:bold" onclick="logoutUser()">👤 ${esc(currentUser)} (로그아웃)</button>
        ` : `
          <button class="badge btn warn" onclick="openAuthModal()">🔑 로그인 (기록 저장)</button>
        `}
      </div>
    </div>
    <h1>나만의 법학<br>문제은행</h1>
    <p>실전 모의고사 테스트 & 개인별 학습 통계 영구 관리</p>
  </section>

  ${!currentUser ? `
    <section class="section">
      <div class="notice warn">
        ⚠️ <b>현재 게스트 모드입니다.</b> 이름과 비밀번호로 로그인하지 않으면 학습기록(정답률, 오답노트, 북마크)이 서버에 보존되지 않습니다.
        <br><button class="primary" style="padding:6px 12px;font-size:12px;margin-top:6px" onclick="openAuthModal()">로그인하고 기록 저장하기</button>
      </div>
    </section>
  ` : ''}

  <section class="section">
    <div class="stats">
      <div class="stat"><b>${bank.length}</b><span>문제은행</span></div>
      <div class="stat"><b>${t.attempted}</b><span>누적 풀이</span></div>
      <div class="stat"><b>${t.accuracy}%</b><span>누적 정답률</span></div>

function openSetup(g,s){
  let arr=bank.filter(q=>q.group===g&&q.subject===s);
  if(!arr.length){alert("이 과목에는 문제가 없습니다.");return}
  S.setupGroup=g;
  S.setupSubject=s;
  S.setupMode="resume";
  S.setupPath=[];
  S.setupLimit=20;
  S.setupOrder="sequential";
  S.setupTimerEnabled=false;
  S.setupTimerSeconds=30;
  S.screen="setupPage";
  render();
}

function matchesPath(q, path){
  if(!path || !path.length) return true;
  if(!q.categoryPath || !q.categoryPath.length) return false;
  for(let i=0; i<path.length; i++){
    if(q.categoryPath[i] !== path[i]) return false;
  }
  return true;
}

function isPathEqual(p1, p2){
  if(!p1 && !p2) return true;
  if(!p1 || !p2) return false;
  if(p1.length !== p2.length) return false;
  return p1.every((v,i)=>v===p2[i]);
}

function renderTocTree(tree, targetState = "setup"){
  let topKeys = Object.keys(tree);
  if(!topKeys.length) return `<div class="meta">등록된 목차가 없습니다.</div>`;

  const curPath = targetState === "test" ? S.testPath : S.setupPath;

  return topKeys.map(k1=>{
    let node1 = tree[k1];
    let isNode1Sel = isPathEqual(curPath, node1.path);
    let subKeys = Object.keys(node1.children);

    return `<div class="tocBox">
      <div class="tocBoxHeader">
        <b style="font-size:15px">📁 ${esc(node1.name)} <small style="color:#777">(${node1.count})</small></b>
        <button class="badge btn ${isNode1Sel?'blue':''}" onclick="${targetState==='test'?'S.testPath':'S.setupPath'}=${JSON.stringify(node1.path).replace(/"/g,"'")};render()">
          ${isNode1Sel ? "✓ 선택됨" : "중단원 전체 풀기"}
        </button>
      </div>
      ${subKeys.length ? `
        <div class="chips">
          ${subKeys.map(k2=>{
            let node2 = node1.children[k2];
            let isNode2Sel = isPathEqual(curPath, node2.path);
            let subSubKeys = Object.keys(node2.children);

            if(subSubKeys.length > 0){
              return `<div class="tocSubBox" style="width:100%">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                  <span style="font-size:13px;font-weight:700">${esc(node2.name)} (${node2.count})</span>
                  <button class="badge btn ${isNode2Sel?'blue':''}" onclick="${targetState==='test'?'S.testPath':'S.setupPath'}=${JSON.stringify(node2.path).replace(/"/g,"'")};render()">${isNode2Sel ? "✓ 선택됨" : "전체"}</button>
                </div>
                <div class="chips">
                  ${subSubKeys.map(k3=>{
                    let node3 = node2.children[k3];
                    let isNode3Sel = isPathEqual(curPath, node3.path);
                    return `<button class="${isNode3Sel?'active':''}" onclick="${targetState==='test'?'S.testPath':'S.setupPath'}=${JSON.stringify(node3.path).replace(/"/g,"'")};render()">${esc(node3.name)} <small>(${node3.count})</small></button>`;
                  }).join("")}
                </div>
              </div>`;
            } else {
              return `<button class="${isNode2Sel?'active':''}" onclick="${targetState==='test'?'S.testPath':'S.setupPath'}=${JSON.stringify(node2.path).replace(/"/g,"'")};render()">${esc(node2.name)} <small>(${node2.count})</small></button>`;
            }
          }).join("")}
        </div>
      `:""}
    </div>`;
  }).join("");
}

function startCustomQuiz(){
  let g=S.setupGroup, s=S.setupSubject;
  let allArr=bank.filter(q=>q.group===g&&q.subject===s);
  let queue=[];

  if(S.setupMode==="resume"){
    let lastId=settings.lastId[s];
    let lastIdx=lastId?allArr.findIndex(q=>q.id===lastId):-1;
    if(lastIdx<0) lastIdx=settings.lastIndex[s]||0;
    let slice=allArr.slice(lastIdx);
    if(!slice.length) slice=allArr;
    
    if(S.setupOrder==="random") slice = shuffleArray(slice);
    let limit=S.setupLimit==="all"?slice.length:parseInt(S.setupLimit,10);
    queue=slice.slice(0,limit);
  }else{
    let filtered=allArr.filter(q=>matchesPath(q, S.setupPath));
    if(S.setupOrder==="random") filtered = shuffleArray(filtered);
    let limit=S.setupLimit==="all"?filtered.length:parseInt(S.setupLimit,10);
    queue=filtered.slice(0,limit);
  }

  if(!queue.length){alert("선택하신 단원에 문제가 없습니다.");return}

  S.group=g;
  S.subject=s;
  S.queue=queue;
  S.qi=0;
  S.selected=[];
  S.submitted=false;
  S.retryPrompt=false;
  S.retrying=false;
  S.screen="quizPage";
  render();
  startTimerIfNeeded();
}

function parseAnswerTokens(ans){
  if(!ans) return [];
  if(Array.isArray(ans)) return ans.map(x=>String(x).trim());
  let s = String(ans);
  const circled = {'①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑩':'10'};
  s = s.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, m => circled[m] || m);
  return s.split(/[,/ ]+/).map(x=>x.trim()).filter(Boolean);
}

function checkAnswerCorrect(selected, answer){
  let user = (Array.isArray(selected) ? selected : [selected]).map(x=>String(x).trim()).filter(Boolean).sort();
  let corr = parseAnswerTokens(answer).sort();
  if(!corr.length) return false;
  if(user.length !== corr.length) return false;
  return user.every((v, i) => v.toUpperCase() === corr[i].toUpperCase());
}

function stopTimer(){
  if(S.timerInterval){
    clearInterval(S.timerInterval);
    S.timerInterval = null;
  }
}

function startTimerIfNeeded(){
  stopTimer();
  if(!S.setupTimerEnabled || S.submitted || S.screen !== "quizPage") return;

  S.timeLeft = S.setupTimerSeconds;
  updateTimerUI();

  S.timerInterval = setInterval(()=>{
    S.timeLeft--;
    updateTimerUI();
    if(S.timeLeft <= 0){
      stopTimer();
      alert("⏰ 제한시간이 종료되었습니다! 오답 처리됩니다.");
      submitQ(true);
    }
  }, 1000);
}

function updateTimerUI(){
  let el = document.getElementById("timerDisplay");
  let bar = document.getElementById("timerProgressBar");
  if(el) el.innerText = `${S.timeLeft}초`;
  if(bar){
    let pct = Math.max(0, (S.timeLeft / S.setupTimerSeconds) * 100);
    bar.style.width = pct + "%";
  }
}

function prevQ(){
  if(S.qi > 0){
    stopTimer();
    S.qi--;
    S.selected = [];
    S.submitted = false;
    S.retryPrompt = false;
    S.retrying = false;
    render();
    startTimerIfNeeded();
  }
}

function passQ(){
  stopTimer();
  if(S.qi < S.queue.length - 1){
    S.qi++;
    S.selected = [];
    S.submitted = false;
    S.retryPrompt = false;
    S.retrying = false;
    render();
    startTimerIfNeeded();
  }else{
    alert("세트 내 문제를 모두 확인했습니다. 패스한 문제는 미풀이 상태로 보존됩니다.");
    go("home");
  }
}

function choose(a){
  if(S.submitted) return;
  let q = S.queue[S.qi];
  let isBinary = (q.type === "ox" || (q.choices && q.choices.length <= 2));

  if(isBinary){
    S.selected = [String(a)];
  } else {
    if(!Array.isArray(S.selected)) S.selected = [];
    let str = String(a);
    let idx = S.selected.indexOf(str);
    if(idx >= 0){
      S.selected.splice(idx, 1);
    } else {
      S.selected.push(str);
      S.selected.sort((x,y)=>parseInt(x,10)-parseInt(y,10));
    }
  }
  render();
}

async function submitQ(isTimeout = false){
  stopTimer();
  let q=S.queue[S.qi];
  let c = isTimeout ? false : checkAnswerCorrect(S.selected, q.answer);
  let x=st(q.id);
  x.attempts++;x.last=new Date().toISOString();
  if(c)x.correct++;else x.wrong++;
  stats[q.id]=x;
  settings.lastSubject=S.subject;
  settings.lastId[S.subject]=q.id;
  
  let fullArr=bank.filter(item=>item.subject===S.subject);
  let globalIdx=fullArr.findIndex(item=>item.id===q.id);
  if(globalIdx>=0) settings.lastIndex[S.subject]=globalIdx;
  
  if(currentUser){
    fetch('/api/stats', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser, id: q.id, isCorrect: c, settings })
    });
  }

  S.submitted=true;
  if(!c && !S.retrying && !isTimeout) S.retryPrompt=true;
  render();
}

function retryQ(){
  S.selected=[];
  S.submitted=false;
  S.retryPrompt=false;
  S.retrying=true;
  render();
  startTimerIfNeeded();
}

function showAns(){S.retryPrompt=false;S.submitted=true;render()}

function nextQ(){
  stopTimer();
  if(S.qi<S.queue.length-1){
    S.qi++;S.selected=[];S.submitted=false;S.retryPrompt=false;S.retrying=false;
    settings.lastId[S.subject]=S.queue[S.qi].id;
    render();
    startTimerIfNeeded();
  }else{
    alert("설정한 문제 세트를 모두 완수했습니다!");
    go("home");
  }
}

function toggleBook(id){
  let willBook = !bookmarks.includes(id);
  bookmarks = willBook ? [...bookmarks, id] : bookmarks.filter(x=>x!==id);
  if(currentUser){
    fetch('/api/bookmark', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser, id, isBookmarked: willBook })
    });
  }
  render();
}

function setNote(id,v){
  notes[id]=v;
  if(currentUser){
    fetch('/api/note', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUser, id, note: v })
    });
  }
}

async function resetProgress(){
  if(!currentUser){
    alert("로그인된 사용자가 아닙니다.");
    return;
  }
  if(!confirm(`[${currentUser}]님의 모든 학습기록을 초기화하시겠습니까?\n등록된 문제 데이터는 삭제되지 않습니다.`)) return;
  await fetch('/api/reset-progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: currentUser })
  });
  stats = {};
  settings = {lastSubject:null, lastIndex:{}, lastId:{}};
  bookmarks = [];
  notes = {};
  alert("학습기록이 초기화되었습니다.");
  render();
}

function onSelectTestSubject(sub){
  S.testSubject = sub;
  for(let g in SUBJECTS){
    if(SUBJECTS[g].includes(sub)){
      S.testGroup = g;
      break;
    }
  }
  S.testPath = [];
  render();
}

function startTestExam(){
  let list = bank.filter(q=>q.subject === S.testSubject && matchesPath(q, S.testPath));
  if(!list.length){
    alert("선택하신 조건에 해당하는 문제가 없습니다.");
    return;
  }

  let shuffled = shuffleArray(list);
  S.testQueue = shuffled.slice(0, Math.min(S.testLimit, shuffled.length));
  S.testQi = 0;
  S.testAnswers = {};
  S.testTimeSpent = {};
  S.testTimeLeft = S.testMinutes * 60;
  S.testCurrentEnterTime = Date.now();
  S.testResultData = null;

  S.screen = "testPlayPage";
  render();
  startTestTimer();
}

function stopTestTimer(){
  if(S.testTimerInterval){
    clearInterval(S.testTimerInterval);
    S.testTimerInterval = null;
  }
}

function startTestTimer(){
  stopTestTimer();
  S.testTimerInterval = setInterval(()=>{
    S.testTimeLeft--;
    let el = document.getElementById("testTimerDisp");
    if(el){
      let m = Math.floor(S.testTimeLeft / 60);
      let s = S.testTimeLeft % 60;
      el.innerText = `${m}분 ${s < 10 ? '0' : ''}${s}초`;
    }
    if(S.testTimeLeft <= 0){
      stopTestTimer();
      alert("⏰ 시험 시간이 종료되었습니다! 자동 채점됩니다.");
      finishTestExam();
    }
  }, 1000);
}

function recordCurrentQuestionTime(){
  if(!S.testQueue || !S.testQueue[S.testQi]) return;
  let qId = S.testQueue[S.testQi].id;
  let elapsed = Math.round((Date.now() - S.testCurrentEnterTime) / 1000);
  S.testTimeSpent[qId] = (S.testTimeSpent[qId] || 0) + Math.max(1, elapsed);
  S.testCurrentEnterTime = Date.now();
}

function chooseTestAnswer(a){
  let q = S.testQueue[S.testQi];
  let isBinary = (q.type === "ox" || (q.choices && q.choices.length <= 2));
  let cur = S.testAnswers[q.id] || [];

  if(isBinary){
    S.testAnswers[q.id] = [String(a)];
  } else {
    let str = String(a);
    let idx = cur.indexOf(str);
    if(idx >= 0) cur.splice(idx, 1);
    else cur.push(str);
    cur.sort((x,y)=>parseInt(x,10)-parseInt(y,10));
    S.testAnswers[q.id] = cur;
  }
  render();
}

function moveTestQ(delta){
  recordCurrentQuestionTime();
  if(delta === 1 && S.testQi === S.testQueue.length - 1){
    if(confirm("마지막 문제입니다. 시험을 종료하고 최종 채점 리포트를 확인하시겠습니까?")){
      finishTestExam();
      return;
    }
  }
  S.testQi = Math.max(0, Math.min(S.testQueue.length - 1, S.testQi + delta));
  render();
}

function finishTestExam(){
  recordCurrentQuestionTime();
  stopTestTimer();

  let correctList = [];
  let wrongList = [];
  let timeRankList = [];

  S.testQueue.forEach((q, idx)=>{
    let userAns = S.testAnswers[q.id] || [];
    let isCorr = checkAnswerCorrect(userAns, q.answer);
    let spent = S.testTimeSpent[q.id] || 0;

    let item = {
      q,
      idx: idx + 1,
      userAns,
      isCorr,
      spent
    };

    if(isCorr) correctList.push(item);
    else wrongList.push(item);

    timeRankList.push(item);

    let x = st(q.id);
    x.attempts++;
    x.last = new Date().toISOString();
    if(isCorr) x.correct++;
    else x.wrong++;
    stats[q.id] = x;

    if(currentUser){
      fetch('/api/stats', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser, id: q.id, isCorrect: isCorr })
      });
    }
  });

  timeRankList.sort((a,b)=> b.spent - a.spent);
  let totalSpentSec = (S.testMinutes * 60) - Math.max(0, S.testTimeLeft);

  S.testResultData = {
    total: S.testQueue.length,
    correctList,
    wrongList,
    timeRankList,
    totalSpentSec,
    score: Math.round((correctList.length / S.testQueue.length) * 100)
  };

  S.screen = "testResultPage";
  render();
}

// 문제은행 & 등록 폼
function getFilteredBankQuestions(){
  let qList = bank.filter(q=>{
    if(S.search){
      let qText = (`${q.text} ${q.subject} ${q.group} ${q.category}`).toLowerCase();
      if(!qText.includes(S.search.toLowerCase())) return false;
    }
    if(S.bankFilter.subject && S.bankFilter.subject !== "전체"){
      if(q.subject !== S.bankFilter.subject) return false;
    }
    if(S.bankFilter.major && S.bankFilter.major !== "전체"){
      let qMaj = q.categoryPath?.[0] || "기본단원";
      if(qMaj !== S.bankFilter.major) return false;
    }
    if(S.bankFilter.sort === "unsolved" && st(q.id).attempts > 0) return false;
    if(S.bankFilter.sort === "bookmark" && !bookmarks.includes(q.id)) return false;
    return true;
  });

  if(S.bankFilter.sort === "wrong"){
    qList.sort((a,b)=> st(b.id).wrong - st(a.id).wrong);
  } else if(S.bankFilter.sort === "rate_asc"){
    qList.sort((a,b)=>{
      let sa = st(a.id), sb = st(b.id);
      let ra = sa.attempts ? sa.correct/sa.attempts : 1;
      let rb = sb.attempts ? sb.correct/sb.attempts : 1;
      return ra - rb;
    });
  }
  return qList;
}

function renderBankListItems(){
  let filtered = getFilteredBankQuestions();
  if(!filtered.length) return `<div class="empty">조건에 해당하는 문제가 없습니다.</div>`;

  return filtered.map((q,i)=>{
    if(S.editingId===q.id) return `<div class="listItem">${editForm()}</div>`;
    let t=st(q.id);
    return `<div class="listItem">
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
        <span class="badge">${esc(q.group)} · ${esc(q.subject)}</span>
        <span class="badge blue">${esc(q.category||"기본단원")}</span>
      </div>
      <p><b>${esc(q.number||i+1)}. ${esc(q.text)}</b></p>
      <small>풀이 ${t.attempts}회 · 오답 ${t.wrong}회 · 정답률 ${t.attempts?Math.round(t.correct/t.attempts*100):0}% ${bookmarks.includes(q.id)?"· ⭐":""}</small>
      <div class="row" style="margin-top:10px">
        <button class="secondary" onclick="openEdit('${esc(q.id)}')">✏️️ 수정</button>
        <button class="danger" onclick="deleteQuestion('${esc(q.id)}')">🗑️ 삭제</button>
      </div>
    </div>`;
  }).join("");
}

function updateAddField(f, val){ if(S.addDraft) S.addDraft[f] = val; }
function updateAddChoice(i, val){ if(S.addDraft) S.addDraft.choices[i] = val; }
function addDraftChoiceItem(){ if(S.addDraft){ S.addDraft.choices.push(""); render(); } }
function removeDraftChoiceItem(i){ if(S.addDraft){ S.addDraft.choices.splice(i, 1); render(); } }

async function submitNewQuestion(){
  let d = S.addDraft;
  if(!d.text.trim()){ alert("문제 본문을 입력하세요."); return; }

  let catPath = d.customCategory.trim() ? d.customCategory.split(">").map(x=>x.trim()).filter(Boolean) : ["기본단원"];
  let newQ = {
    id: "custom-" + Date.now(),
    number: String(bank.length + 1),
    group: d.group || "기타",
    subject: d.subject || "헌법",
    categoryPath: catPath,
    category: catPath.join(" > "),
    type: d.type,
    text: d.text.trim(),
    choices: d.type === "mcq" ? d.choices.map(c=>c.trim()).filter(Boolean) : [],
    answer: d.type === "ox" ? d.answer.toUpperCase() : d.answer.trim(),
    explanation: d.explanation.trim() || "(해설 없음)"
  };

  await fetch('/api/question', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(newQ)
  });

  bank.push(newQ);
  alert("문제가 등록되었습니다!");
  closeAddModal();
}

function addQuestionModal(){
  let d = S.addDraft;
  return `<div class="modalOverlay" onclick="if(event.target===this)closeAddModal()">
    <div class="modalContent">
      <div class="modalHeader"><b>➕ 문제 직접 등록</b><button class="back" onclick="closeAddModal()">✕</button></div>
      <div class="modalBody reviewBox">
        <label>과목 선택</label>
        <select onchange="updateAddField('subject',this.value)">
          <option value="헌법">헌법</option><option value="행정법">행정법</option>
          <option value="형법">형법</option><option value="형사소송법">형사소송법</option>
          <option value="민법">민법</option><option value="민사소송법">민사소송법</option>
          <option value="가족법">가족법</option><option value="상법">상법</option>
        </select>
        <label>단원 (구분자는 ' > ' 입력)</label>
        <input placeholder="예: 헌법총론 > 기본원리" value="${esc(d.customCategory)}" oninput="updateAddField('customCategory',this.value)">
        <label>유형</label>
        <div class="segmentedControl">
          <button class="${d.type==='ox'?'active':''}" onclick="S.addDraft.type='ox';S.addDraft.answer='O';render()">OX</button>
          <button class="${d.type==='mcq'?'active':''}" onclick="S.addDraft.type='mcq';S.addDraft.answer='1';render()">객관식</button>
        </div>
        <label>문제 본문</label>
        <textarea rows="3" placeholder="지문 입력" oninput="updateAddField('text',this.value)">${esc(d.text)}</textarea>
        ${d.type==='mcq'?`
          <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px">
            <label style="margin:0">선지</label>
            <button class="badge btn" onclick="addDraftChoiceItem()">+ 선지 추가</button>
          </div>
          ${d.choices.map((c,i)=>`
            <div class="row" style="margin-bottom:6px">
              <input placeholder="선지 ${i+1}" value="${esc(c)}" oninput="updateAddChoice(${i},this.value)">
              <button class="danger" style="flex:0" onclick="removeDraftChoiceItem(${i})">삭제</button>
            </div>
          `).join('')}
          <label>정답 번호 (복수 정답: 1, 3)</label>
          <input value="${esc(d.answer)}" oninput="updateAddField('answer',this.value)">
        `:`
          <label>정답</label>
          <div class="segmentedControl">
            <button class="${d.answer==='O'?'active':''}" onclick="updateAddField('answer','O');render()">O</button>
            <button class="${d.answer==='X'?'active':''}" onclick="updateAddField('answer','X');render()">X</button>
          </div>
        `}
        <label>해설</label>
        <textarea rows="2" placeholder="해설" oninput="updateAddField('explanation',this.value)">${esc(d.explanation)}</textarea>
      </div>
      <div class="modalFooter">
        <button class="primary full" onclick="submitNewQuestion()">서버에 등록</button>
      </div>
    </div>
  </div>`;
}

function openEdit(id){
  let q=bank.find(x=>x.id===id);
  if(!q) return;
  S.editingId=id;
  S.editDraft={ ...q, choices:[...q.choices] };
  render();
}
function closeEdit(){ S.editingId=null; S.editDraft=null; render(); }
function updateEditField(f,v){ if(S.editDraft) S.editDraft[f]=v; }
async function saveEdit(){
  let q = S.editDraft;
  await fetch('/api/question', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(q)
  });
  let idx = bank.findIndex(x=>x.id===q.id);
  if(idx>=0) bank[idx] = q;
  closeEdit();
}
async function deleteQuestion(id){
  if(!confirm("문제를 삭제하시겠습니까?")) return;
  await fetch(`/api/question/${id}`, { method: 'DELETE' });
  bank = bank.filter(x=>x.id!==id);
  render();
}

function editForm(){
  let d=S.editDraft;
  return `<div class="card" style="margin-top:12px;border:2px solid #173d2a">
    <b>✏️ 문제 수정</b>
    <div class="reviewBox">
      <label>본문</label><textarea rows="3" oninput="updateEditField('text',this.value)">${esc(d.text)}</textarea>
      <label>정답</label><input value="${esc(d.answer)}" oninput="updateEditField('answer',this.value)">
      <label>해설</label><textarea rows="2" oninput="updateEditField('explanation',this.value)">${esc(d.explanation)}</textarea>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="saveEdit()">저장</button>
      <button class="secondary" onclick="closeEdit()">취소</button>
    </div>
  </div>`;
}

function wrongPage(){
  let arr=bank.filter(q=>st(q.id).wrong>0);
  return topBar("오답노트")+`<section class="title"><h1>오답노트</h1><p>${arr.length}문제</p></section><section class="section">
  ${arr.length?arr.map(q=>`<div class="listItem">
    <span class="badge red">${esc(q.subject)}</span>
    <p><b>${esc(q.text)}</b></p>
    <small>오답 ${st(q.id).wrong}회 · 정답: ${esc(q.answer)}</small>
  </div>`).join(''):`<div class="empty">오답이 없습니다.</div>`}
  </section>${bottom()}`;
}

function bookmarkPage(){
  let arr=bank.filter(q=>bookmarks.includes(q.id));
  return topBar("북마크")+`<section class="title"><h1>⭐ 북마크</h1><p>${arr.length}문제</p></section><section class="section">
  ${arr.length?arr.map(q=>`<div class="listItem">
    <span class="badge blue">${esc(q.subject)}</span>
    <p><b>${esc(q.text)}</b></p>
    <small>정답: ${esc(q.answer)}</small>
  </div>`).join(''):`<div class="empty">북마크한 문제가 없습니다.</div>`}
  </section>${bottom()}`;
}

function importPage(){
  return topBar("문제 파일 업로드") + `
    <section class="section">
      <div class="upload">
        <div class="ico">📚</div>
        <h2>JSON 파일 서버 일괄 업로드</h2>
        <input id="jsonFiles" type="file" accept=".json,application/json" class="hidden" onchange="uploadJsonFile(this)">
        <button class="primary" onclick="document.getElementById('jsonFiles').click()">JSON 파일 선택하기</button>
      </div>
    </section>
    ${bottom()}
  `;
}

async function uploadJsonFile(input){
  let f = input.files[0];
  if(!f) return;
  let r = new FileReader();
  r.onload = async () => {
    try {
      let d = JSON.parse(r.result);
      let { qs } = validateSingleFile(d);
      const res = await fetch('/api/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: qs, mode: 'merge' })
      });
      const data = await res.json();
      alert(`성공적으로 ${data.count}문제를 서버에 병합했습니다!`);
      await fetchBootstrap();
      go('home');
    } catch(e){
      alert("업로드 실패: " + e.message);
    }
  };
  r.readAsText(f);
}

function bottom(){
  return `<div class="bottom">
    <button onclick="go('home')">⌂<small>홈</small></button>
    <button onclick="go('testSetupPage')">📝<small>테스트</small></button>
    <button onclick="go('bankPage')">📚<small>문제은행</small></button>
    <button onclick="go('wrongPage')">📕<small>오답</small></button>
    <button onclick="go('bookmarkPage')">⭐<small>북마크</small></button>
  </div>`;
}
