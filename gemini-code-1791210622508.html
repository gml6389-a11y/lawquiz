<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Law Quiz Server Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f4;color:#17191c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:860px;min-height:100vh;margin:auto;background:#fff;padding-bottom:90px;box-shadow:0 0 30px #0001}
.hero{padding:44px 25px 30px;background:linear-gradient(145deg,#102b1d,#214c35);color:#fff;border-radius:0 0 28px 28px}
.brand{font-weight:800;font-size:14px;margin-bottom:28px}.hero h1{font-size:32px;line-height:1.25;margin:0 0 10px;letter-spacing:-1.3px}
.hero p{margin:0;opacity:.82;font-size:14px;line-height:1.6}
.section{padding:14px 20px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:4}
.back{border:0;background:none;font-size:22px}.title{padding:26px 22px 10px}.title h1{margin:0 0 7px;font-size:26px}.title p{margin:0;color:#777;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f6f8f7;border-radius:14px;padding:14px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#777}
.group{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px;background:#fff}.group b{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chips button{border:1px solid #dfe4e1;background:#f8faf9;border-radius:9px;padding:8px 12px;transition:0.15s;font-size:13px}
.chips button.active{background:#173d2a;color:#fff;border-color:#173d2a;font-weight:bold}
.primary,.secondary,.danger{border:0;border-radius:13px;padding:14px 17px;font-weight:800}.primary{background:#173d2a;color:#fff}.secondary{background:#edf0ee;color:#303532}.danger{background:#f8e8e8;color:#982f2f}.full{width:100%;margin-top:10px}
.card{border:1px solid #e1e5e3;border-radius:18px;padding:18px;margin-bottom:12px}
.upload{border:2px dashed #b7c2bc;border-radius:18px;padding:28px;text-align:center;background:#fafcfb}
.progress{height:7px;background:#e7ebe8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#214c35;transition:.3s}
.reviewBox label{display:block;font-size:12px;color:#777;margin:14px 0 6px}.reviewBox input,.reviewBox textarea,.reviewBox select{width:100%;border:1px solid #dfe4e1;border-radius:10px;padding:11px;outline:none}
.row{display:flex;gap:9px}.row>*{flex:1}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;background:#eef3f0;color:#31533f;font-size:11px;font-weight:800}
.badge.blue{background:#e8f0ff;color:#28518b}.badge.gray{background:#f0f0f0;color:#555}.badge.red{background:#ffe8e8;color:#922e2e}
.badge.btn{cursor:pointer;border:1px solid #d5dad7}
.listItem{border:1px solid #e1e5e3;border-radius:14px;padding:15px;margin-bottom:10px}.empty{text-align:center;color:#888;padding:60px 20px}
.qtext{font-size:20px;line-height:1.65;margin:18px 0 22px;white-space:pre-wrap}.answers{display:grid;gap:9px}
.answer{border:1px solid #dfe4e1;background:#fff;border-radius:13px;padding:14px 16px;text-align:left;line-height:1.5}
.answer.sel{border:2px solid #173d2a;background:#f2f7f4}
.result{margin-top:18px;padding:18px;border-radius:16px;background:#f5f8f6}.wrong{background:#fff7f7;border:1px solid #efd0d0}.correct{border:1px solid #cfe2d6}
.explain{border-top:1px solid #e2e6e3;margin-top:14px;padding-top:14px;line-height:1.65;white-space:pre-wrap}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(860px,100%);height:70px;background:#fff;border-top:1px solid #e5e8e6;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.bottom button{border:0;background:#fff;color:#555}.bottom small{display:block;margin-top:4px;font-size:10px}
.meta{font-size:12px;color:#777;line-height:1.6}
.search{width:100%;border:1px solid #dfe4e1;border-radius:11px;padding:11px}
.optionCard{border:2px solid #e1e5e3;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.optionCard.active{border-color:#173d2a;background:#f4f8f5}
.rangeWrap{margin:16px 0 10px}
.rangeWrap input[type=range]{width:100%;margin:10px 0;accent-color:#173d2a}
.segmentedControl{display:flex;background:#eaeeeb;border-radius:12px;padding:4px;gap:4px;margin-top:10px}
.segmentedControl button{flex:1;border:0;background:transparent;padding:12px 0;border-radius:9px;font-weight:700;font-size:13px;color:#555}
.segmentedControl button.active{background:#fff;color:#173d2a}
.timerBox{background:#fff3f3;border:1px solid #ffd0d0;border-radius:12px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.timerProgress{height:5px;background:#f0e3e3;border-radius:99px;overflow:hidden;margin-top:4px}
.timerProgress span{display:block;height:100%;background:#d94848;transition:0.1s linear}
.modalOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.modalContent{background:#fff;border-radius:20px;width:min(660px,100%);max-height:88vh;display:flex;flex-direction:column}
.modalHeader{padding:18px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.modalBody{padding:18px 22px;overflow-y:auto;flex:1}
.modalFooter{padding:14px 22px;border-top:1px solid #eee;display:flex;gap:10px}
.inputError{border:2px solid #d94848 !important;background:#fff8f8 !important}
.errMsg{color:#c02b2b;font-size:11px;font-weight:700;margin-top:4px;display:block}
</style>
</head>
<body><div id="app"></div>
<script>
const SUBJECTS = {
  "공법": ["헌법", "행정법"],
  "형사법": ["형법", "형사소송법"],
  "민사법": ["민법", "민사소송법", "가족법", "상법"]
};

let bank = [];
let S = {
  screen: "home", queue: [], qi: 0, selected: [], submitted: false,
  setupGroup: null, setupSubject: null, setupLimit: 20, setupOrder: "sequential",
  setupTimerEnabled: false, setupTimerSeconds: 30, timeLeft: 30, timerInterval: null,
  search: "", showAddModal: false, addDraft: null, addErrors: {}
};

async function loadServerData() {
  try {
    const res = await fetch('/api/questions');
    bank = await res.json();
    render();
  } catch (e) {
    alert('서버와 통신할 수 없습니다: ' + e.message);
  }
}

function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
  let fn = { home, bankPage, quizPage, wrongPage, bookmarkPage, setupPage }[S.screen] || home;
  document.getElementById("app").innerHTML = '<div class="app">' + fn() + '</div>';
}
function go(s){ stopTimer(); S.screen = s; render(); }
function topBar(t, b="home"){ return `<header class="top"><button class="back" onclick="go('${b}')">←</button><b>${esc(t)}</b><span></span></header>`; }

function home() {
  const attempted = bank.reduce((a, q) => a + q.attempts, 0);
  const correct = bank.reduce((a, q) => a + q.correct, 0);
  const accuracy = attempted ? Math.round((correct / attempted) * 100) : 0;

  return `
    <section class="hero">
      <div class="brand">⚖️ LAW QUIZ · Server Edition</div>
      <h1>중앙 DB 연동<br>법학 문제은행</h1>
      <p>서버 영구 저장 & 실전 타이머 모드</p>
    </section>
    <section class="section">
      <div class="stats">
        <div class="stat"><b>${bank.length}</b><span>등록 문제</span></div>
        <div class="stat"><b>${attempted}</b><span>누적 풀이</span></div>
        <div class="stat"><b>${accuracy}%</b><span>누적 정답률</span></div>
      </div>
    </section>
    <section class="title"><h1>과목 선택</h1><p>과목을 선택하여 문제풀이를 시작하세요.</p></section>
    <section class="section">
      ${Object.keys(SUBJECTS).map(g => `
        <div class="group">
          <b>${esc(g)}</b>
          <div class="chips">
            ${SUBJECTS[g].map(s => {
              const qs = bank.filter(q => q.subject === s);
              const solved = qs.filter(q => q.attempts > 0).length;
              return `<button onclick="openSetup('${esc(g)}','${esc(s)}')">${esc(s)} <small>${solved}/${qs.length}</small></button>`;
            }).join('')}
          </div>
        </div>
      `).join('')}
    </section>
    <section class="section">
      <button class="primary full" onclick="document.getElementById('importFile').click()">📥 JSON 파일 서버로 가져오기</button>
      <input id="importFile" type="file" accept=".json" style="display:none" onchange="uploadJsonToServer(this)">
    </section>
    ${bottom()}
  `;
}

function openSetup(g, s) {
  const qs = bank.filter(q => q.subject === s);
  if (!qs.length) { alert('해당 과목에 문제가 없습니다. 문제은행에서 등록해주세요.'); return; }
  S.setupGroup = g;
  S.setupSubject = s;
  S.screen = "setupPage";
  render();
}

function setupPage() {
  const s = S.setupSubject;
  const count = bank.filter(q => q.subject === s).length;
  return topBar(`${s} 학습 설정`, "home") + `
    <section class="title"><h1>${esc(s)} 설정</h1></section>
    <section class="section">
      <b>1. 문제당 제한 시간</b>
      <div class="segmentedControl">
        <button class="${!S.setupTimerEnabled?'active':''}" onclick="S.setupTimerEnabled=false;render()">⏱️ 무제한</button>
        <button class="${S.setupTimerEnabled?'active':''}" onclick="S.setupTimerEnabled=true;render()">⏳ 제한시간 모드</button>
      </div>
      ${S.setupTimerEnabled ? `
        <div class="card" style="margin-top:10px;background:#fff8f8">
          <span>제한시간: <b>${S.setupTimerSeconds}초</b></span>
          <input type="range" min="20" max="60" step="5" value="${S.setupTimerSeconds}" oninput="S.setupTimerSeconds=parseInt(this.value);render()">
        </div>
      `: ''}

      <div style="margin-top:20px">
        <b>2. 풀이 순서</b>
        <div class="segmentedControl">
          <button class="${S.setupOrder==='sequential'?'active':''}" onclick="S.setupOrder='sequential';render()">🔢 순차 출제</button>
          <button class="${S.setupOrder==='random'?'active':''}" onclick="S.setupOrder='random';render()">🎲 랜덤 출제</button>
        </div>
      </div>
      <button class="primary full" style="margin-top:30px" onclick="startQuiz()">🚀 풀이 시작 (${count}문제 대기)</button>
    </section>
  `;
}

function startQuiz() {
  let list = bank.filter(q => q.subject === S.setupSubject);
  if (S.setupOrder === 'random') list = [...list].sort(() => Math.random() - 0.5);
  S.queue = list.slice(0, S.setupLimit);
  S.qi = 0;
  S.selected = [];
  S.submitted = false;
  S.screen = "quizPage";
  render();
  startTimerIfNeeded();
}

function stopTimer() {
  if (S.timerInterval) { clearInterval(S.timerInterval); S.timerInterval = null; }
}

function startTimerIfNeeded() {
  stopTimer();
  if (!S.setupTimerEnabled || S.submitted || S.screen !== "quizPage") return;
  S.timeLeft = S.setupTimerSeconds;
  updateTimerUI();
  S.timerInterval = setInterval(() => {
    S.timeLeft--;
    updateTimerUI();
    if (S.timeLeft <= 0) {
      stopTimer();
      alert('⏰ 제한시간 초과!');
      submitAnswer(true);
    }
  }, 1000);
}

function updateTimerUI() {
  const el = document.getElementById("tDisp");
  const bar = document.getElementById("tBar");
  if (el) el.innerText = `${S.timeLeft}초`;
  if (bar) bar.style.width = `${(S.timeLeft / S.setupTimerSeconds) * 100}%`;
}

function quizPage() {
  const q = S.queue[S.qi];
  const pct = ((S.qi + 1) / S.queue.length) * 100;
  const isBinary = q.type === "ox" || (q.choices && q.choices.length <= 2);

  return `
    <header class="top">
      <button class="back" onclick="go('setupPage')">←</button>
      <b>${esc(q.subject)}</b>
      <span></span>
    </header>
    <section class="section">
      <div class="progress"><span style="width:${pct}%"></span></div>
      ${S.setupTimerEnabled && !S.submitted ? `
        <div class="timerBox"><span>⏳ 남은 시간</span><b id="tDisp">${S.timeLeft}초</b></div>
        <div class="timerProgress"><span id="tBar" style="width:${(S.timeLeft/S.setupTimerSeconds)*100}%"></span></div>
      `: ''}
      <div style="display:flex;justify-content:space-between;margin:12px 0">
        <span class="meta">${S.qi+1} / ${S.queue.length} 문제</span>
        <button class="back" onclick="toggleBookmarkServer('${q.id}', ${!q.bookmarked})">${q.bookmarked?'★':'☆'}</button>
      </div>
      <div class="qtext">${esc(q.text)}</div>
      <div class="answers">
        ${q.type === 'ox'
          ? ['O', 'X'].map(a => `<button class="answer ${S.selected.includes(a)?'sel':''}" onclick="choose('${a}')" ${S.submitted?'disabled':''}>${a}</button>`).join('')
          : q.choices.map((c, i) => `<button class="answer ${S.selected.includes(String(i+1))?'sel':''}" onclick="choose('${i+1}')" ${S.submitted?'disabled':''}>${i+1}.${esc(c)}</button>`).join('')
        }
      </div>
      ${!S.submitted
        ? `<button class="primary full" onclick="submitAnswer(false)" ${!S.selected.length?'disabled':''}>제출</button>`
        : `<div class="result ${S.isCorrect?'correct':'wrong'}">
            <b>${S.isCorrect?'✅ 정답!':'❌ 오답!'}</b>
            <p>정답: <b>${esc(q.answer)}</b></p>
            <div class="explain">${esc(q.explanation || '해설 없음')}</div>
            <button class="primary full" onclick="nextQuestion()">다음 문제 →</button>
           </div>`
      }
    </section>
  `;
}

function choose(val) {
  if (S.submitted) return;
  const q = S.queue[S.qi];
  if (q.type === 'ox') S.selected = [val];
  else {
    const idx = S.selected.indexOf(val);
    if (idx >= 0) S.selected.splice(idx, 1);
    else S.selected.push(val);
  }
  render();
}

async function submitAnswer(isTimeout = false) {
  stopTimer();
  const q = S.queue[S.qi];
  const userAns = S.selected.sort().join(',');
  const isCorrect = !isTimeout && (userAns === q.answer.trim());
  S.isCorrect = isCorrect;
  S.submitted = true;

  // 서버에 풀이 결과 전송
  await fetch('/api/progress/attempt', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ questionId: q.id, isCorrect })
  });
  q.attempts++;
  if (isCorrect) q.correct++; else q.wrong++;
  render();
}

function nextQuestion() {
  if (S.qi < S.queue.length - 1) {
    S.qi++;
    S.selected = [];
    S.submitted = false;
    render();
    startTimerIfNeeded();
  } else {
    alert('세트 완료!');
    go('home');
  }
}

async function toggleBookmarkServer(id, bookmarked) {
  await fetch('/api/progress/bookmark', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ questionId: id, bookmarked })
  });
  const q = bank.find(item => item.id === id);
  if (q) q.bookmarked = bookmarked;
  render();
}

// 문제은행 탭 & 추가 모달
function bankPage() {
  return topBar("문제은행") + `
    <section class="title" style="display:flex;justify-content:space-between">
      <h1>문제 목록 (${bank.length})</h1>
      <button class="primary" onclick="openAddModal()">➕ 문제 추가</button>
    </section>
    <section class="section">
      ${bank.map(q => `
        <div class="listItem">
          <span class="badge">${esc(q.subject)}</span>
          <p><b>${esc(q.text)}</b></p>
          <small>정답: ${esc(q.answer)} \vert{} 시도: ${q.attempts}회</small>
          <button class="danger" style="float:right;padding:4px 8px" onclick="deleteQuestionServer('${q.id}')">삭제</button>
        </div>
      `).join('')}
    </section>
    ${S.showAddModal ? addQuestionModal() : ''}
    ${bottom()}
  `;
}

function openAddModal() {
  S.addDraft = { subject: '헌법', group: '공법', type: 'ox', text: '', choices: ['','','',''], answer: 'O', explanation: '' };
  S.showAddModal = true;
  render();
}

function addQuestionModal() {
  const d = S.addDraft;
  return `
    <div class="modalOverlay">
      <div class="modalContent">
        <div class="modalHeader"><b>문제 직접 등록 (DB 저장)</b><button onclick="S.showAddModal=false;render()">✕</button></div>
        <div class="modalBody reviewBox">
          <label>과목</label>
          <select onchange="S.addDraft.subject=this.value">
            <option value="헌법">헌법</option><option value="행정법">행정법</option>
            <option value="형법">형법</option><option value="형사소송법">형사소송법</option>
            <option value="민법">민법</option><option value="민사소송법">민사소송법</option>
          </select>
          <label>문제 유형</label>
          <select onchange="S.addDraft.type=this.value;render()">
            <option value="ox">OX</option><option value="mcq">객관식</option>
          </select>
          <label>본문</label>
          <textarea rows="3" oninput="S.addDraft.text=this.value">${esc(d.text)}</textarea>
          <label>정답</label>
          <input value="${esc(d.answer)}" oninput="S.addDraft.answer=this.value" placeholder="OX는 O/X, 객관식은 1,2 등">
          <label>해설</label>
          <textarea rows="2" oninput="S.addDraft.explanation=this.value">${esc(d.explanation)}</textarea>
        </div>
        <div class="modalFooter">
          <button class="primary full" onclick="saveNewQuestionServer()">서버 DB에 저장</button>
        </div>
      </div>
    </div>
  `;
}

async function saveNewQuestionServer() {
  if (!S.addDraft.text.trim()) { alert('문제 본문을 입력하세요.'); return; }
  await fetch('/api/questions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(S.addDraft)
  });
  S.showAddModal = false;
  await loadServerData();
}

async function deleteQuestionServer(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  await fetch(`/api/questions/${id}`, { method: 'DELETE' });
  await loadServerData();
}

async function uploadJsonToServer(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      const qs = Array.isArray(data.questions) ? data.questions : data;
      await fetch('/api/questions/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: qs, mode: 'merge' })
      });
      alert('서버 업로드 완료!');
      await loadServerData();
    } catch(e) { alert('JSON 파싱 오류: ' + e.message); }
  };
  reader.readAsText(file);
}

function wrongPage() {
  const list = bank.filter(q => q.wrong > 0);
  return topBar("오답노트") + `<section class="section">${list.map(q => `<div class="listItem"><p><b>${esc(q.text)}</b></p><small>오답 ${q.wrong}회</small></div>`).join('')}</section>${bottom()}`;
}

function bookmarkPage() {
  const list = bank.filter(q => q.bookmarked);
  return topBar("북마크") + `<section class="section">${list.map(q => `<div class="listItem"><p><b>${esc(q.text)}</b></p></div>`).join('')}</section>${bottom()}`;
}

function bottom() {
  return `<div class="bottom">
    <button onclick="go('home')">⌂<small>홈</small></button>
    <button onclick="go('bankPage')">📚<small>문제은행</small></button>
    <button onclick="go('wrongPage')">📕<small>오답</small></button>
    <button onclick="go('bookmarkPage')">⭐<small>북마크</small></button>
  </div>`;
}

// 최초 데이터 로드
loadServerData();
</script>
</body>
</html>
